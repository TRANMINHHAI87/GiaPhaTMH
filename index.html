<script>
/* ---- core.js ---- */
/* ===== core.js — logic thuần (không đụng DOM): tiện ích, ngày tháng, chỉ mục cây, tính quan hệ họ hàng ===== */
(function (root) {
'use strict';
const GP = root.GP || (root.GP = {});

/* ---------- tiện ích ---------- */
GP.uid = function (n) {
  n = n || 12;
  const a = new Uint8Array(n);
  (root.crypto || require('crypto').webcrypto).getRandomValues(a);
  const cs = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < n; i++) s += cs[a[i] % 36];

GP.fold = function (s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim();
};
/* tìm theo đầu từ: "yen" khớp "Đặng Thị Yến" nhưng không khớp "Nguyễn"; số thì khớp ở bất kỳ đâu */
GP.match = function (q, text) {
  q = GP.fold(q); if (!q) return true;
  const t = GP.fold(text), words = t.split(/[^a-z0-9]+/);
  return q.split(' ').every(function (k) {
    if (/^\d+$/.test(k)) return t.replace(/\D/g, '').indexOf(k) >= 0;
    return words.some(function (w) { return w.indexOf(k) === 0; });
  });
};
GP.titleName = function (s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLocaleLowerCase('vi')
    .replace(/(^|[\s\-'(])(\p{L})/gu, function (m, a, b) { return a + b.toLocaleUpperCase('vi'); });
};
GP.guessGender = function (name) {
  const t = GP.fold(name).split(' ');
  if (t.length < 2) return '';
  const mid = t.slice(1, -1);
  if (mid.indexOf('thi') >= 0) return 'F';
  if (mid.indexOf('van') >= 0) return 'M';
  return '';
};
const pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

/* ---------- ngày tháng (lưu dạng YYYY | YYYY-MM | YYYY-MM-DD) ---------- */
GP.parseDate = function (v) {
  if (v == null) return '';
  const s = String(v).trim();
  if (!s) return '';
  const ok = function (y, mo, d) {
    y = +y; if (!(y >= 1000 && y <= 2200)) return null;
    if (mo == null) return String(y);
    mo = +mo; if (!(mo >= 1 && mo <= 12)) return null;
    if (d == null) return y + '-' + pad2(mo);
    d = +d; const dim = new Date(y, mo, 0).getDate();
    if (!(d >= 1 && d <= dim)) return null;
    return y + '-' + pad2(mo) + '-' + pad2(d);
  };
  let m;
  if ((m = /^(\d{4})$/.exec(s))) return ok(m[1]);
  if ((m = /^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})\s*[\/\-. ]\s*(\d{4})$/.exec(s))) return ok(m[3], m[2], m[1]);
  if ((m = /^(\d{1,2})\s*[\/\-.]\s*(\d{4})$/.exec(s))) return ok(m[2], m[1]);
  if ((m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?(?:[T ].*)?$/.exec(s))) return ok(m[1], m[2], m[3]);
  if ((m = /^(\d{2})(\d{2})(\d{4})$/.exec(s))) return ok(m[3], m[2], m[1]);
  if ((m = /^(\d{2})(\d{4})$/.exec(s))) return ok(m[2], m[1]);
  return null;

GP.dateParts = function (iso) {
  if (!iso) return null;
  const m = /^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?$/.exec(iso);
  return m ? { y: +m[1], m: m[2] ? +m[2] : 0, d: m[3] ? +m[3] : 0 } : null;
};
GP.fmtDate = function (iso) {
  const p = GP.dateParts(iso);
  if (!p) return '';

  if (p.m) return pad2(p.m) + '/' + p.y;

GP.yearOf = function (iso) { const p = GP.dateParts(iso); return p ? p.y : 0; };

  if (a.m && b.m) {

    if (a.d && b.d && a.d !== b.d) return a.d < b.d ? -1 : 1;
  }
  return 0;

  const ms = Math.round((n - 25569) * 86400000);

  if (d) return '? – ' + d;
  return p.dead ? 'đã mất' : '';
};

/* -1: x là bậc trên (anh/chị) của y; 1: bậc dưới; 0: chưa đủ dữ liệu */
GP.cmpSib = function (x, y) {

  if (sn > 0) return 'em';
  return sx === 'M' ? 'anh/em' : sx === 'F' ? 'chị/em' : 'anh/chị/em';
}

const SPW = function (sx) { return sx === 'F' ? 'vợ' : sx === 'M' ? 'chồng' : 'vợ/chồng'; };
const GT = function (sx) { return sx === 'M' ? ' trai' : sx === 'F' ? ' gái' : ''; };
const OW = function (sx) { return sx === 'M' ? 'ông' : sx === 'F' ? 'bà' : 'ông/bà'; };
/* ---------- nhiều vợ (tam thê tứ thiếp), nhiều chồng: vợ cả, vợ hai, vợ ba… / chồng trước, chồng sau ----------
   Thứ tự là thứ tự trong danh sách vợ/chồng của người đó (sửa được ở màn Sửa thông tin). */
const SP_ORD = ['cả', 'hai', 'ba', 'tư', 'năm', 'sáu', 'bảy', 'tám', 'chín', 'mười'];

GP.spOrd = function (i, n, sx) {      // người thứ i (0 là người đầu) trong n vợ/chồng; sx: giới tính của chính người vợ/chồng ấy

  const m = / (cả|hai|ba|tư|năm|sáu|bảy|tám|chín|mười|trước|sau|thứ \S+)$/.exec(String(term || ''));

const INLAW_UNCLE = {
  'bác': { F: 'bác gái', M: 'bác trai' }, 'chú': { F: 'thím' }, 'cậu': { F: 'mợ' },
  'cô': { M: 'chú' }, 'dì': { M: 'chú' },
  'bác/chú': { F: 'bác gái/thím' }, 'bác/cậu': { F: 'bác gái/mợ' },
  'bác/cô': { M: 'bác trai/chú' }, 'bác/dì': { M: 'bác trai/chú' }
};
const INLAW_GRAND = {
  'ông chú': 'bà thím', 'ông cậu': 'bà mợ', 'ông bác': 'bà bác', 'bà bác': 'ông bác', 'bà cô': 'ông chú', 'bà dì': 'ông chú'

/* ---------- chỉ mục một cây ---------- */
function Index(list) {
  this.byId = new Map(); this.kidIds = new Map(); this._anc = new Map(); this._sp = new Map(); this._kids = new Map();
  this.fatherSet = new Set(); this.motherSet = new Set();
  for (const p of list) if (p && p.id) this.byId.set(p.id, p);
  for (const p of this.byId.values()) {
    if (p.fatherId && this.byId.has(p.fatherId) && p.fatherId !== p.id) { push(this.kidIds, p.fatherId, p.id); this.fatherSet.add(p.fatherId); }
    if (p.motherId && this.byId.has(p.motherId) && p.motherId !== p.id && p.motherId !== p.fatherId) { push(this.kidIds, p.motherId, p.id); this.motherSet.add(p.motherId); }

}
function push(map, k, v) { const a = map.get(k); if (a) a.push(v); else map.set(k, [v]); }
GP.Index = Index;
const IP = Index.prototype;

IP.get = function (id) { return this.byId.get(id) || null; };
IP.all = function () { return Array.from(this.byId.values()); };
IP.size = function () { return this.byId.size; };
IP.nm = function (id) { const p = this.byId.get(id); return p ? (p.name || '(chưa có tên)') : '?'; };
IP.sex = function (p) {
  if (typeof p === 'string') p = this.byId.get(p);
  if (!p) return '';
  if (p.gender === 'M' || p.gender === 'F') return p.gender;
  if (this.fatherSet.has(p.id)) return 'M';
  if (this.motherSet.has(p.id)) return 'F';

};
IP.father = function (p) { return (p && p.fatherId && p.fatherId !== p.id && this.byId.get(p.fatherId)) || null; };
IP.mother = function (p) { return (p && p.motherId && p.motherId !== p.id && this.byId.get(p.motherId)) || null; };

  const p = this.byId.get(id), out = [];

  return out;
};
IP.children = function (id) {
  let k = this._kids.get(id);
  if (!k) {
    const self = this;
    k = GP.sortSibs((this.kidIds.get(id) || []).map(function (x) { return self.byId.get(x); }));
    this._kids.set(id, k);
  }

};
IP.spouses = function (id) {
  let s = this._sp.get(id);

  const p = this.byId.get(id); s = [];
  if (p) {
    const seen = new Set([id]);
    for (const sid of (p.spouseIds || [])) {
      const q = this.byId.get(sid);
      if (q && !seen.has(sid)) { seen.add(sid); s.push(q); }
    }

      const oid = c.fatherId === id ? c.motherId : c.fatherId;

IP.spRank = function (ofId, spId) {  // spId là vợ/chồng thứ mấy của ofId (chỉ khi ofId có từ 2 vợ/chồng)
  const list = this.spouses(ofId);

};
IP.anc = function (id) {             // Map(tổ tiên -> {d, prev}) gồm cả chính mình (d=0)
  let m = this._anc.get(id);
  if (m) return m;

    const next = [];

IP.pathUp = function (id, c) {       // [id, ..., c]

IP.isAncestor = function (ancId, id) { return ancId !== id && this.anc(id).has(ancId); };

};
IP.descendants = function (id) {
  const seen = new Set(); const st = [id];

IP.generations = function (rootId) { // Map(id -> đời) tính từ gốc; vợ/chồng cùng đời

/* ---------- huyết thống ---------- */
IP.blood = function (a, b) {
  if (!this.byId.has(a) || !this.byId.has(b)) return null;

/* A gọi B là gì — pa = [A..C], pb = [B..C], C là tổ chung gần nhất */
IP.nameBlood = function (pa, pb) {
  const u = pa.length - 1, d = pb.length - 1, self = this;
  const sx = this.sex(pb[0]);

    k.type = 'anc'; k.r1 = roles[0];

    }

    if (u === 3) return { term: (last === 'F' ? 'cụ ông' : 'cụ bà') + ord, desc: plus(ancPhrase(roles) + ' (bên ' + side + ')'), k: k };

/* B là vợ/chồng của R — R là người thân của A (rel = A gọi R) */
IP.nameSpouseOfRel = function (aId, rId, bId, rel) {
  const A = this.byId.get(aId), R = this.byId.get(rId);

  const sw = SPW(sx), k = rel.k, suf = sx === 'F' ? 'dâu' : sx === 'M' ? 'rể' : 'dâu/rể';
  const rk = this.spRank(rId, bId), ow = rk ? ' ' + rk.w : '';
  let term = null, desc = sw + ow + ' của ' + rel.term + ' ' + (R.name || '');
  if (k.type === 'anc') {
    if (k.u === 1) {
      const slot = sx === 'F' ? A.motherId : sx === 'M' ? A.fatherId : 'x';
      if (slot && sx === 'F') {                       // vợ khác của bố: mẹ cả, mẹ hai… (vợ sau mẹ mình là mẹ kế)
        const rm = this.spRank(rId, A.motherId);
        term = rk ? 'mẹ' + ow : 'mẹ kế';
        if (rk && rm && rk.i > rm.i) desc += ' (mẹ kế)';
      } else if (slot) term = sx === 'M' ? 'bố dượng' : sw + ' của ' + rel.term;
      else { term = sw + ow + ' của ' + rel.term; desc += ' (chưa khai là ' + (sx === 'F' ? 'mẹ' : 'bố') + ' đẻ)'; }
    } else if (sx === 'F' && rk && /^(ông |cụ ông|kỵ ông|cụ tổ ông)/.test(rel.term)) term = rel.term.replace('ông', 'bà') + ow;   // bà nội hai, cụ bà ba…
    else term = OW(sx);
  } else if (k.type === 'desc') {
    term = (k.d === 1 ? 'con ' : k.d === 2 ? 'cháu ' : 'chắt ') + suf;
  } else if (k.type === 'col') {
    if (k.g === 0) {
      term = (k.sen < 0 ? (sx === 'F' ? 'chị' : sx === 'M' ? 'anh' : 'anh/chị') : k.sen > 0 ? 'em' : (sx === 'F' ? 'chị/em' : sx === 'M' ? 'anh/em' : 'anh/chị/em')) + ' ' + suf + (k.u >= 2 ? ' họ' : '');
    } else if (k.g === 1) {
      const t = INLAW_UNCLE[k.base] && INLAW_UNCLE[k.base][sx];
      if (t) { term = t + (k.d >= 2 ? ' họ' : ''); if (k.base === 'cô' || k.base === 'dì') desc += ' (có nơi gọi là dượng)'; }
    } else if (k.g < 0) {
      term = (k.g >= -2 ? 'cháu ' : 'chắt ') + suf;
    } else if (k.g === 2) {

/* B là người thân của S — S là vợ/chồng của A (rel = S gọi B) */
IP.nameRelOfSpouse = function (aId, sId, bId, rel) {
  const A = this.byId.get(aId), S = this.byId.get(sId), B = this.byId.get(bId);
  let sxS = this.sex(S);
  if (!sxS) { const sa = this.sex(A); sxS = sa === 'M' ? 'F' : sa === 'F' ? 'M' : ''; }
  const suf = SPW(sxS), k = rel.k;
  let term, desc = rel.term + ' của ' + suf + ' (' + (S.name || '') + ')';
  if (k.type === 'anc' && k.u === 1) term = rel.term + ' ' + suf;
  else if (k.type === 'desc' && k.d === 1) {
    const sa = this.sex(A), slot = sa === 'M' ? B.fatherId : sa === 'F' ? B.motherId : 'x';
    term = slot ? 'con riêng của ' + suf : 'con của ' + suf;
    if (!slot) desc += ' (chưa khai ' + (sa === 'M' ? 'bố' : 'mẹ') + ')';
  } else if (k.type === 'desc') term = rel.term;           // cháu, chắt của chồng/vợ vẫn gọi là cháu, chắt
  else if (k.type === 'col' && k.g === 0) term = rel.term + (k.u >= 2 ? ' họ ' : ' ') + suf;
  else if (k.type === 'col' && (k.g === 1 || k.g === -1)) term = rel.term + (k.close === 'họ' ? ' họ ' : ' ') + suf;
  else term = rel.term + ' (bên ' + suf + ')';
  return { term: term, desc: desc, k: { type: 'ros', rk: k } };
};

/* A–S vợ chồng, B–T vợ chồng, S và T là người thân (rel = S gọi T) */
IP.nameDouble = function (aId, sId, tId, bId, rel) {
  const sa = this.sex(aId), sb = this.sex(bId);
  let sxS = this.sex(sId);
  if (!sxS) sxS = sa === 'M' ? 'F' : sa === 'F' ? 'M' : '';
  const suf = SPW(sxS), T = this.byId.get(tId), k = rel.k;
  const x = this.nameSpouseOfRel(sId, tId, bId, rel);
  let term;
  if (k.type === 'col' && k.g === 0 && k.u === 1 && sa === 'M' && sb === 'M') term = 'anh em cọc chèo';
  else if (k.type === 'col' && k.g === 0 && k.u === 1 && sa === 'F' && sb === 'F') term = 'chị em dâu';
  else term = x.term + ' (bên ' + suf + ')';
  return { term: term, desc: SPW(sb) + ' của ' + rel.term + ' ' + suf + ' (' + (T.name || '') + ')', k: { type: 'dbl', rk: k } };
};

function catBlood(k) {
  if (k.type === 'anc') return k.u === 1 ? 'parent' : k.u === 2 ? 'grand' : 'anc';
  if (k.type === 'desc') return k.d === 1 ? 'child' : k.d === 2 ? 'grandchild' : 'desc';
  if (k.g === 0) return k.u === 1 ? 'sib' : k.u === 2 ? 'cousin' : 'far';
  if (k.g === 1 && k.d === 1) return k.r1 === 'F' ? 'uncleF' : 'uncleM';
  if (k.g === -1 && k.u === 1) return 'nib';
  if (k.g === 2 && k.d === 1) return 'granduncle';
  return 'far';
}
function catSor(k) {
  if (k.type === 'anc') return k.u === 1 ? 'parent' : k.u === 2 ? 'grand' : 'anc';
  if (k.type === 'desc') return k.d === 1 ? 'childinlaw' : 'inlaw';
  if (k.g === 0 && k.u === 1) return 'sibinlaw';
  if (k.g === 1 && k.d === 1) return k.r1 === 'F' ? 'uncleF' : 'uncleM';
  return 'inlaw';
}
GP.GROUPS = [
  ['parent', 'Bố mẹ'], ['grand', 'Ông bà'], ['anc', 'Cụ, kỵ (bề trên trực hệ)'], ['spouse', 'Vợ / chồng'], ['cospouse', 'Vợ khác của chồng'],
  ['sib', 'Anh chị em ruột'], ['sibinlaw', 'Anh rể, chị dâu, em rể, em dâu'], ['child', 'Con'], ['childinlaw', 'Con dâu, con rể'],
  ['grandchild', 'Cháu nội, cháu ngoại'], ['desc', 'Chắt, chút'],
  ['uncleF', 'Bác, chú, cô (bên nội)'], ['uncleM', 'Bác, cậu, dì (bên ngoại)'],
  ['cousin', 'Anh chị em họ'], ['nib', 'Cháu (con của anh chị em)'], ['granduncle', 'Ông bà trong họ (anh chị em của ông bà)'],
  ['far', 'Họ hàng xa hơn'], ['spouseSide', 'Bên vợ / bên chồng'], ['inlaw', 'Dâu, rể khác'], ['thonggia', 'Thông gia']
];

IP.hopLabel = function (xId, yId) {
  const x = this.byId.get(xId), y = this.byId.get(yId);
  if (x.fatherId === yId) return 'bố';
  if (x.motherId === yId) return 'mẹ';
  if (y.fatherId === xId || y.motherId === xId) { const s = this.sex(y); return s === 'M' ? 'con trai' : s === 'F' ? 'con gái' : 'con'; }
  return SPW(this.sex(y));
};
function chainOf(r) { return r.pa.concat(r.pb.slice(0, -1).reverse()); }

/* Quan hệ giữa A và B. opt.deep: tìm cả thông gia và đường nối xa */
IP.relation = function (aId, bId, opt) {
  opt = opt || {};
  const A = this.byId.get(aId), B = this.byId.get(bId);
  if (!A || !B) return null;
  if (aId === bId) return { kind: 'self', ab: { term: 'chính mình', desc: '' }, ba: { term: 'chính mình', desc: '' }, chain: [aId], cat: 'self' };
  const isSp = this.spouses(aId).some(function (s) { return s.id === bId; });
  const bl = this.blood(aId, bId);
  if (isSp) {
    const sA = this.sex(A) || (this.sex(B) === 'M' ? 'F' : this.sex(B) === 'F' ? 'M' : ''), sB = this.sex(B) || (sA === 'M' ? 'F' : sA === 'F' ? 'M' : '');
    const rB = this.spRank(aId, bId), rA = this.spRank(bId, aId);       // B là vợ thứ mấy của A, A là chồng thứ mấy của B
    const res = {
      kind: 'spouse', chain: [aId, bId], cat: 'spouse',
      ab: { term: SPW(sB) + (rB ? ' ' + rB.w : ''), desc: rA ? 'là ' + SPW(sA) + ' ' + rA.w + ' của ' + OW(sB) : '' },
      ba: { term: SPW(sA) + (rA ? ' ' + rA.w : ''), desc: rB ? 'là ' + SPW(sB) + ' ' + rB.w + ' của ' + OW(sA) : '' }
    };
    if (bl) res.also = { ab: this.nameBlood(bl.pa, bl.pb), ba: this.nameBlood(bl.pb, bl.pa) };
    return res;
  }
  if (bl) {
    const ab = this.nameBlood(bl.pa, bl.pb), ba = this.nameBlood(bl.pb, bl.pa);
    return { kind: 'blood', ab: ab, ba: ba, chain: chainOf(bl), cat: catBlood(ab.k), common: bl.c };
  }
  /* hai bà cùng là vợ của một ông (hoặc hai ông cùng là chồng của một bà) */
  for (const H of this.spouses(aId)) {
    const ra = this.spRank(H.id, aId), rb = this.spRank(H.id, bId);
    if (!ra || !rb) continue;
    const sa = this.sex(A) || (this.sex(H) === 'M' ? 'F' : 'M'), sb = this.sex(B) || sa, hw = sa === 'F' ? 'chồng' : 'vợ';
    const call = function (me, other, sxo) { return sxo === 'F' ? (other.i < me.i ? 'chị ' : 'em ') + other.w : 'chồng ' + other.w + ' của vợ'; };
    return {
      kind: 'cospouse', chain: [aId, H.id, bId], cat: 'cospouse',
      ab: { term: call(ra, rb, sb), desc: SPW(sb) + ' ' + rb.w + ' của ' + hw + ' (' + (H.name || '') + ')' },
      ba: { term: call(rb, ra, sa), desc: SPW(sa) + ' ' + ra.w + ' của ' + hw + ' (' + (H.name || '') + ')' }
    };
  }
  /* qua một cuộc hôn nhân */
  let best = null;
  for (const R of this.spouses(bId)) {
    const r = this.blood(aId, R.id);
    if (r && (!best || r.u + r.d < best.cost)) best = { t: 'sor', r: r, P: R, cost: r.u + r.d };
  }
  for (const S of this.spouses(aId)) {
    const r = this.blood(S.id, bId);
    if (r && (!best || r.u + r.d < best.cost)) best = { t: 'ros', r: r, P: S, cost: r.u + r.d };
  }
  if (best && best.t === 'sor') {
    const r = best.r, R = best.P;
    const relAR = this.nameBlood(r.pa, r.pb);
    return {
      kind: 'inlaw', ab: this.nameSpouseOfRel(aId, R.id, bId, relAR), ba: this.nameRelOfSpouse(bId, R.id, aId, this.nameBlood(r.pb, r.pa)),
      chain: chainOf(r).concat([bId]), cat: catSor(relAR.k)
    };
  }
  if (best && best.t === 'ros') {
    const r = best.r, S = best.P;
    return {
      kind: 'inlaw', ab: this.nameRelOfSpouse(aId, S.id, bId, this.nameBlood(r.pa, r.pb)), ba: this.nameSpouseOfRel(bId, S.id, aId, this.nameBlood(r.pb, r.pa)),
      chain: [aId].concat(chainOf(r)), cat: 'spouseSide'

  }
  /* qua hai cuộc hôn nhân (vợ/chồng của người thân bên vợ/chồng) */
  let b2 = null;
  for (const S of this.spouses(aId)) for (const T of this.spouses(bId)) {
    if (S.id === T.id) continue;
    const r = this.blood(S.id, T.id);
    if (r && (!b2 || r.u + r.d < b2.cost)) b2 = { r: r, S: S, T: T, cost: r.u + r.d };
  }
  if (b2) {
    const r = b2.r;
    return {
      kind: 'inlaw', ab: this.nameDouble(aId, b2.S.id, b2.T.id, bId, this.nameBlood(r.pa, r.pb)), ba: this.nameDouble(bId, b2.T.id, b2.S.id, aId, this.nameBlood(r.pb, r.pa)),
      chain: [aId].concat(chainOf(r)).concat([bId]), cat: 'spouseSide'
    };
  }
  if (!opt.deep) return null;

  /* thông gia / họ hàng nối qua một cặp vợ chồng ở giữa */
  let b3 = null;
  if (this.byId.size <= 4000) {
    for (const R of this.byId.values()) {
      const sps = this.spouses(R.id);
      if (!sps.length || R.id === aId || R.id === bId) continue;
      const rA = this.blood(aId, R.id);
      if (!rA) continue;
      for (const X of sps) {
        if (X.id === aId || X.id === bId) continue;
        const rB = this.blood(X.id, bId);
        if (!rB) continue;
        const cost = rA.u + rA.d + rB.u + rB.d;
        if (!b3 || cost < b3.cost) b3 = { rA: rA, rB: rB, R: R, X: X, cost: cost };
      }
    }
  }
  if (b3) {
    const R = b3.R, X = b3.X, rA = b3.rA, rB = b3.rB;
    const relAR = this.nameBlood(rA.pa, rA.pb), relXB = this.nameBlood(rB.pa, rB.pb);
    const relBX = this.nameBlood(rB.pb, rB.pa), relRA = this.nameBlood(rA.pb, rA.pa);
    const AX = this.nameSpouseOfRel(aId, R.id, X.id, relAR), BR = this.nameSpouseOfRel(bId, X.id, R.id, relBX);
    const tg = relAR.k.type === 'desc' && relAR.k.d === 1 && relXB.k.type === 'anc' && relXB.k.u === 1;
    const tg2 = relBX.k.type === 'desc' && relBX.k.d === 1 && relRA.k.type === 'anc' && relRA.k.u === 1;
    const sa = this.sex(A), sb = this.sex(B);
    return {
      kind: 'inlaw2',
      ab: { term: tg ? (OW(sb) + ' thông gia') : relXB.term + ' của ' + AX.term, desc: relXB.term + ' của ' + AX.term + ' ' + (X.name || '') + ' (' + SPW(this.sex(X)) + ' của ' + relAR.term + ' ' + (R.name || '') + ')' },
      ba: { term: tg2 ? (OW(sa) + ' thông gia') : relRA.term + ' của ' + BR.term, desc: relRA.term + ' của ' + BR.term + ' ' + (R.name || '') + ' (' + SPW(this.sex(R)) + ' của ' + relBX.term + ' ' + (X.name || '') + ')' },
      chain: chainOf(rA).concat(chainOf(rB)), cat: tg ? 'thonggia' : 'inlaw'
    };
  }
  /* đường nối bất kỳ */
  const prev = new Map(); prev.set(aId, null);
  let frontier = [aId], found = false;
  while (frontier.length && !found) {
    const next = [];
    for (const x of frontier) {
      const nb = this.parentIds(x).concat(this.kidIds.get(x) || []).concat(this.spouses(x).map(function (s) { return s.id; }));
      for (const y of nb) if (!prev.has(y)) { prev.set(y, x); if (y === bId) { found = true; break; } next.push(y); }
      if (found) break;
    }
    frontier = next;
  }
  if (found) {
    const chain = []; let x = bId;
    while (x != null) { chain.push(x); x = prev.get(x); }
    chain.reverse();
    return { kind: 'chain', ab: { term: 'có liên hệ xa', desc: 'nối với nhau qua ' + (chain.length - 2) + ' người trung gian' }, ba: { term: 'có liên hệ xa', desc: 'nối với nhau qua ' + (chain.length - 2) + ' người trung gian' }, chain: chain, cat: 'other' };
  }
  return { kind: 'none', ab: { term: 'chưa có liên hệ', desc: 'Hai người chưa được nối với nhau trong cây này' }, ba: { term: 'chưa có liên hệ', desc: '' }, chain: [], cat: 'none' };
};

/* Tất cả người thân của một người, gom theo nhóm */
IP.relativesOf = function (id) {
  const out = new Map();
  if (!this.byId.has(id)) return out;
  const self = this, done = new Set();
  const add = function (cat, pid, rel) { push(out, cat, { id: pid, term: rel.ab.term, desc: rel.ab.desc, back: rel.ba.term, hint: rel.ab.k && rel.ab.k.hint }); done.add(pid); };
  for (const q of this.byId.values()) {
    if (q.id === id) continue;
    const rel = this.relation(id, q.id);
    if (rel && rel.cat) add(rel.cat, q.id, rel);
  }
  /* thông gia: bố mẹ của con dâu / con rể */
  for (const c of this.children(id)) for (const x of this.spouses(c.id)) for (const pid of this.parentIds(x.id)) {
    if (done.has(pid) || pid === id) continue;
    const rel = this.relation(id, pid, { deep: true });
    if (rel && rel.cat === 'thonggia') add('thonggia', pid, rel);
  }
  const rank = function (t) { return (/ngoại/.test(t) ? 2 : 0) + (/^(bà|mẹ|cụ bà|kỵ bà)/.test(t) ? 1 : 0); };
  const spo = new Map(this.spouses(id).map(function (s, i) { return [s.id, i]; }));
  out.forEach(function (list, cat) {
    list.sort(function (x, y) {
      const px = self.byId.get(x.id), py = self.byId.get(y.id);
      if (cat === 'spouse') return (spo.has(x.id) ? spo.get(x.id) : 99) - (spo.has(y.id) ? spo.get(y.id) : 99);
      if (cat === 'cospouse') return GP.ordOf(x.term) - GP.ordOf(y.term);
      if (cat === 'parent' || cat === 'grand') return rank(x.term) - rank(y.term) || GP.ordOf(x.term) - GP.ordOf(y.term) || (GP.yearOf(px.birth) || 9999) - (GP.yearOf(py.birth) || 9999);
      if (cat === 'anc') return (GP.yearOf(px.birth) || 9999) - (GP.yearOf(py.birth) || 9999) || GP.ordOf(x.term) - GP.ordOf(y.term);
      return GP.cmpSib(px, py) || ((px.c || 0) - (py.c || 0));
    });
  });
  return out;
};

  const clean = function (s) { return s.replace(/^[\s:.,;|/\\\-_]+|[\s:;|/\\\-_]+$/g, '').replace(/\s+/g, ' ').trim(); };
  const DATE = /(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*((?:19|20)\d{2})/;
  const STOP = /noi thuong tru|place of residence|noi cu tru|co gia tri|date of expiry|ngay, thang|date of|que quan|place of origin|gioi tinh|quoc tich|nationality|noi dang ky|place of birth/;
  const HEAD = /cong hoa|xa hoi|doc lap|socialist|independence|can cuoc|citizen|identity|viet nam|republic/;

  /* họ tên */
  let i = find(/ho va ten|full name|chu dem va ten|ho, chu dem|ten khai sinh/);
  const nameOk = function (s) { s = clean(s.replace(/[^\p{L}\s]/gu, ' ')); return s.split(' ').length >= 2 && s.length >= 5 && !/full name|ho va ten|khai sinh/.test(GP.fold(s)) ? s : ''; };
  if (i >= 0) out.name = nameOk(afterColon(L[i])) || (L[i + 1] ? nameOk(L[i + 1]) : '');
  if (!out.name) {
    for (let j = 0; j < L.length; j++) {
      const s = clean(L[j].replace(/[^\p{L}\s]/gu, ' '));
      if (s.length >= 6 && s === s.toLocaleUpperCase('vi') && s.split(' ').length >= 2 && s.split(' ').length <= 6 && !HEAD.test(F[j])) { out.name = s; break; }
    }
  }
  if (out.name) out.name = GP.fixName(GP.titleName(out.name));

  /* ngày sinh */
  let m;
  i = find(/ngay sinh|date of birth|nam sinh|of birth/);
  if (i >= 0) m = DATE.exec(L[i]) || (L[i + 1] ? DATE.exec(L[i + 1]) : null);
  if (!m) for (let j = 0; j < L.length && !m; j++) { if (!/co gia tri|expiry|ngay cap|date of issue/.test(F[j])) m = DATE.exec(L[j]); }
  if (m) out.birth = GP.parseDate(m[1] + '/' + m[2] + '/' + m[3]) || '';

  /* giới tính */
  i = find(/gioi tinh|\bsex\b/);
  if (i >= 0) {
    let s = F[i].replace(/^.*?(gioi tinh|\bsex\b)/, '').replace(/quoc tich.*$|nationality.*$/, '');
    s = s.replace(/gioi tinh|sex/g, ' ');
    if (/\bnu\b/.test(s)) out.gender = 'F'; else if (/\bnam\b/.test(s)) out.gender = 'M';
  }
  if (!out.gender && out.name) out.gender = GP.guessGender(out.name);

  /* quê quán và nơi thường trú: lấy phần sau dấu ":" và các dòng kế tiếp cho tới nhãn khác */
  const block = function (re) {
    const k = find(re);
    if (k < 0) return '';
    const parts = []; const a = afterColon(L[k]);
    if (a && !STOP.test(GP.fold(a))) parts.push(a);
    for (let j = k + 1; j < L.length && parts.length < 3; j++) {
      if (STOP.test(F[j]) || DATE.test(L[j])) break;
      parts.push(L[j]);
    }
    return clean(parts.join(', ').replace(/\s*,\s*,+/g, ',').replace(/,\s*$/, ''));
  };
  out.hometown = block(/que quan|place of origin|noi dang ky khai sinh|place of birth/);
  out.address = block(/noi thuong tru|place of residence|noi cu tru/);
  return out;
};

/* ---------- CSV ---------- */
GP.csvParse = function (text) {
  text = String(text || '');
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n/, 1)[0] || '';
  let delim = ',', bestN = 0;
  for (const d of [',', ';', '\t']) { const n = first.split(d).length; if (n > bestN) { bestN = n; delim = d; } }
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
};

/* ---------- XLSX (cần fflate) ---------- */
function unx(s) {
  return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-fA-F]+);/g, function (m, h) { return String.fromCodePoint(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function (m, d) { return String.fromCodePoint(+d); })
    .replace(/_x([0-9A-Fa-f]{4})_/g, function (m, h) { return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&amp;/g, '&');
}
function colIndex(letters) { let n = 0; for (let i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64); return n - 1; }
function colName(i) { let s = ''; i++; while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

GP.xlsxRead = function (u8) {
  const ff = root.fflate;
  const files = ff.unzipSync(u8);
  const txt = function (n) { return files[n] ? ff.strFromU8(files[n]) : ''; };
  const ss = [];
  txt('xl/sharedStrings.xml').replace(/<si\b[^>]*>([\s\S]*?)<\/si>/g, function (m, inner) {
    let s = '';
    inner.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, function (m2, t) { s += unx(t); return ''; });
    ss.push(s); return '';
  });
  let sheetPath = '';
  const wb = txt('xl/workbook.xml'), rels = txt('xl/_rels/workbook.xml.rels');
  const sm = /<sheet\b[^>]*\br:id="([^"]+)"/.exec(wb);
  if (sm) {
    const re = new RegExp('<Relationship\\b[^>]*\\bId="' + sm[1] + '"[^>]*>');
    const rm = re.exec(rels);
    const tm = rm && /\bTarget="([^"]+)"/.exec(rm[0]);
    if (tm) sheetPath = tm[1].charAt(0) === '/' ? tm[1].slice(1) : 'xl/' + tm[1].replace(/^\.\//, '');
  }
  if (!sheetPath || !files[sheetPath]) {
    sheetPath = Object.keys(files).filter(function (k) { return /^xl\/worksheets\/[^/]+\.xml$/.test(k); }).sort()[0] || '';
  }
  const sheet = txt(sheetPath);
  if (!sheet) throw new Error('Không đọc được trang tính trong tệp Excel');
  const rows = [];
  sheet.replace(/<row\b([^>]*)>([\s\S]*?)<\/row>/g, function (m, rattrs, inner) {
    const row = [];
    inner.replace(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, function (m2, attrs, body) {
      const r = /\br="([A-Z]+)\d+"/.exec(attrs), t = /\bt="(\w+)"/.exec(attrs);
      const col = r ? colIndex(r[1]) : row.length;
      let v = '';
      if (body) {
        const vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(body), tt = t && t[1];
        if (tt === 's') v = vm ? (ss[+vm[1]] == null ? '' : ss[+vm[1]]) : '';
        else if (tt === 'inlineStr') { body.replace(/<t\b[^>]*>([\s\S]*?)<\/t>/g, function (m3, x) { v += unx(x); return ''; }); }
        else if (tt === 'str' || tt === 'e') v = vm ? unx(vm[1]) : '';
        else if (tt === 'b') v = vm ? (vm[1] === '1' ? 'TRUE' : 'FALSE') : '';
        else if (vm) { const num = Number(vm[1]); v = isNaN(num) ? unx(vm[1]) : num; }
      }
      row[col] = v; return '';
    });
    const rn = /\br="(\d+)"/.exec(rattrs);
    rows[rn ? +rn[1] - 1 : rows.length] = row;
    return '';
  });
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i] || []; for (let j = 0; j < r.length; j++) if (r[j] === undefined) r[j] = '';
    rows[i] = r;
  }
  return rows;
};

GP.xlsxWrite = function (rows, opt) {
  opt = opt || {};
  const ff = root.fflate;
  const esc = function (s) { return String(s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  const ncol = rows.reduce(function (m, r) { return Math.max(m, r.length); }, 1);
  let sd = '';
  rows.forEach(function (r, i) {
    sd += '<row r="' + (i + 1) + '"' + (i === 0 ? ' ht="30" customHeight="1"' : '') + '>';
    r.forEach(function (v, j) {
      if (v === '' || v == null) return;
      const ref = colName(j) + (i + 1), st = i === 0 ? 1 : 2;
      if (typeof v === 'number' && isFinite(v)) sd += '<c r="' + ref + '" s="' + (i === 0 ? 1 : 0) + '"><v>' + v + '</v></c>';
      else sd += '<c r="' + ref + '" t="inlineStr" s="' + st + '"><is><t xml:space="preserve">' + esc(v) + '</t></is></c>';

  cols += '</cols>';
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const files = {
    '[Content_Types].xml': X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': X + '<workbook xmlns="' + NS + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="' + esc(opt.sheet || 'GiaPha').replace(/"/g, '') + '" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels': X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': X + '<styleSheet xmlns="' + NS + '"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF1E2C4"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf><xf numFmtId="49" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
    'xl/worksheets/sheet1.xml': X + '<worksheet xmlns="' + NS + '"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' + cols + '<sheetData>' + sd + '</sheetData></worksheet>'
  };
  const z = {};
  Object.keys(files).forEach(function (k) { z[k] = ff.strToU8(files[k]); });
  return ff.zipSync(z, { level: 6 });
};

/* ---------- nhập / xuất danh sách ---------- */
GP.SHEET_HEAD = ['STT', 'Họ và tên', 'Giới tính', 'Ngày sinh', 'Đã mất (x)', 'Ngày mất (dương lịch)', 'Ngày giỗ (âm lịch)', 'Quê quán', 'Địa chỉ hiện tại', 'Số điện thoại', 'Bố (STT hoặc họ tên)', 'Mẹ (STT hoặc họ tên)', 'Vợ/Chồng (STT hoặc họ tên)', 'Con thứ', 'Ghi chú'];
GP.SHEET_WIDTHS = [6, 26, 10, 13, 10, 15, 14, 28, 32, 15, 22, 22, 24, 9, 30];

function mapHeader(row) {
  const m = {};
  const rules = [
    ['stt', /^stt$|^tt$|^so tt|^so thu tu|^#$/], ['note', /ghi chu|note/], ['dead', /da mat/], ['gio', /ngay gio|gio am|\bgio\b/], ['death', /ngay mat|nam mat|mat ngay|\bmat\b/],
    ['birth', /ngay sinh|nam sinh|sinh ngay|ngay thang nam sinh|ngay, thang, nam sinh/], ['gender', /gioi tinh|^gt$|nam\/nu/],
    ['hometown', /que quan|nguyen quan|^que$/], ['address', /dia chi|noi o|thuong tru|cho o|cu tru/], ['phone', /dien thoai|sdt|so dt|phone/],
    ['order', /con thu|thu tu trong/], ['father', /\b(bo|cha)\b|con ong/], ['mother', /\bme\b|con ba/], ['spouse', /\bvo\b|\bchong\b/],
    ['name', /ho va ten|ho ten|^ten$|chu dem va ten|full name/]
  ];
  for (let j = 0; j < row.length; j++) {
    const f = GP.fold(row[j]);
    if (!f) continue;
    for (const r of rules) { if (r[1].test(f)) { if (m[r[0]] == null) m[r[0]] = j; break; } }
  }
  return m.name != null ? m : null;
}
function cellStr(v) { return v == null ? '' : String(v).replace(/\s+/g, ' ').trim(); }
function cellDate(v) {
  if (v === '' || v == null) return '';
  if (typeof v === 'number') {
    if (Number.isInteger(v) && v >= 1000 && v <= 2200) return String(v);
    if (v > 2200 && v < 110000) return GP.excelSerialToIso(v);
    return null;
  }
  return GP.parseDate(v);
}

/* rows: mảng dòng; existing: người đang có trong cây. Trả {add, upd, warnings, skipped} hoặc {error} */
GP.importRows = function (rows, existing) {
  let hi = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 20); i++) { const m = mapHeader(rows[i] || []); if (m) { hi = i; map = m; break; } }
  if (hi < 0) return { error: 'Không tìm thấy dòng tiêu đề có cột "Họ và tên". Hãy dùng tệp mẫu.' };
  const warnings = [], recs = [];
  const get = function (row, key) { return map[key] == null ? '' : row[map[key]]; };
  const exByKey = new Map();
  for (const p of existing) exByKey.set(GP.fold(p.name) + '|' + (p.birth || ''), p);
  const now = Date.now();
  let skipped = 0;
  for (let i = hi + 1; i < rows.length; i++) {
    const row = rows[i] || [];
    let name = cellStr(get(row, 'name'));
    if (!name) continue;
    if (name.length > 3 && name === name.toLocaleUpperCase('vi')) name = GP.titleName(name);
    const ln = i + 1;
    const g = GP.fold(cellStr(get(row, 'gender')));
    let gender = /^(nam|m|male|trai)$/.test(g) ? 'M' : /^(nu|f|female|gai)$/.test(g) ? 'F' : '';
    if (!gender) gender = GP.guessGender(name);
    let birth = cellDate(get(row, 'birth'));
    if (birth === null) { warnings.push('Dòng ' + ln + ' (' + name + '): ngày sinh "' + cellStr(get(row, 'birth')) + '" không hợp lệ, đã bỏ trống.'); birth = ''; }
    let death = cellDate(get(row, 'death'));
    if (death === null) { warnings.push('Dòng ' + ln + ' (' + name + '): ngày mất không hợp lệ, đã bỏ trống.'); death = ''; }
    const deadMark = GP.fold(cellStr(get(row, 'dead')));
    let gioD = 0, gioM = 0;
    const gioRaw = cellStr(get(row, 'gio'));
    if (gioRaw) {
      const gm = /^(\d{1,2})\s*[\/\-. ]\s*(\d{1,2})/.exec(gioRaw);
      if (gm && +gm[1] >= 1 && +gm[1] <= 30 && +gm[2] >= 1 && +gm[2] <= 12) { gioD = +gm[1]; gioM = +gm[2]; }
      else warnings.push('Dòng ' + ln + ' (' + name + '): ngày giỗ "' + gioRaw + '" không hợp lệ (cần dạng ngày/tháng âm, vd 12/3), đã bỏ trống.');
    }
    let phone = get(row, 'phone');
    phone = typeof phone === 'number' ? String(phone) : cellStr(phone);
    phone = phone.replace(/[^\d+]/g, '');
    if (/^\d{9}$/.test(phone)) phone = '0' + phone;
    const ord = parseInt(cellStr(get(row, 'order')), 10);
    const sttRaw = cellStr(get(row, 'stt'));
    const rec = {
      p: {
        id: 'p' + GP.uid(11), name: name, gender: gender, birth: birth || '', dead: !!death || !!gioD || /^(x|co|1|true|da mat|mat|yes)$/.test(deadMark), death: death || '',
        gioD: gioD, gioM: gioM,
        hometown: cellStr(get(row, 'hometown')), address: cellStr(get(row, 'address')), phone: phone, order: ord > 0 ? ord : 0,
        note: cellStr(get(row, 'note')), photo: '', fatherId: '', motherId: '', spouseIds: [], c: now + recs.length, u: now
      },
      ln: ln, stt: sttRaw, f: cellStr(get(row, 'father')), m: cellStr(get(row, 'mother')), s: cellStr(get(row, 'spouse')), dup: null
    };
    const ex = exByKey.get(GP.fold(name) + '|' + rec.p.birth);
    if (ex && rec.p.birth) { rec.dup = ex; skipped++; }
    recs.push(rec);
  }
  if (!recs.length) return { error: 'Tệp không có dòng dữ liệu nào (cột "Họ và tên" đang trống).' };

  const bySTT = new Map(), byName = new Map();
  recs.forEach(function (r, i) {
    const key = r.stt || String(i + 1);
    if (!bySTT.has(key)) bySTT.set(key, r);
    push(byName, GP.fold(r.p.name), r.dup || r.p);
  });
  for (const p of existing) { const k = GP.fold(p.name); const arr = byName.get(k); if (!arr || arr.indexOf(p) < 0) push(byName, k, p); }
  const upd = new Map();                    // người đã có bị sửa (bản sao)
  const fresh = new Set(recs.filter(function (r) { return !r.dup; }).map(function (r) { return r.p; }));
  const editable = function (p) {
    if (fresh.has(p)) return p;
    let c = upd.get(p.id);
    if (!c) { c = Object.assign({}, p, { spouseIds: (p.spouseIds || []).slice(), u: now }); upd.set(p.id, c); }
    return c;
  };
  const resolve = function (ref, rec, want, label) {
    if (!ref) return null;
    if (/^\d+$/.test(ref)) {
      const r = bySTT.get(ref) || bySTT.get(String(+ref));
      if (!r) { warnings.push('Dòng ' + rec.ln + ' (' + rec.p.name + '): không có STT ' + ref + ' để nối ' + label + '.'); return null; }
      return r.dup || r.p;
    }
    let c = (byName.get(GP.fold(ref)) || []).filter(function (q) { return q !== rec.p && q !== rec.dup; });
    if (want) { const c2 = c.filter(function (q) { return !q.gender || q.gender === want; }); if (c2.length) c = c2; }
    if (c.length > 1 && label !== 'vợ/chồng' && rec.p.birth) {
      const c3 = c.filter(function (q) { return !q.birth || GP.cmpIso(q.birth, rec.p.birth) < 0; });
      if (c3.length) c = c3;
    }
    if (c.length === 1) return c[0];
    warnings.push('Dòng ' + rec.ln + ' (' + rec.p.name + '): ' + (c.length ? 'có ' + c.length + ' người trùng tên "' + ref + '"' : 'không tìm thấy "' + ref + '"') + ' để nối ' + label + '. Hãy ghi STT thay cho họ tên.');
    return null;
  };
  const parentOf = new Map();               // id con -> [id bố, id mẹ] để chặn vòng lặp
  for (const p of existing) parentOf.set(p.id, [p.fatherId, p.motherId]);
  const isAnc = function (ancId, id) {
    const seen = new Set(); const st = [id];
    while (st.length) { const x = st.pop(); for (const q of (parentOf.get(x) || [])) { if (!q || seen.has(q)) continue; if (q === ancId) return true; seen.add(q); st.push(q); } }
    return false;
  };
  const linkSp = function (a, b) {
    if (!a || !b || a.id === b.id) return;
    const ea = editable(a), eb = editable(b);
    if (ea.spouseIds.indexOf(b.id) < 0) ea.spouseIds.push(b.id);
    if (eb.spouseIds.indexOf(a.id) < 0) eb.spouseIds.push(a.id);
  };
  for (const r of recs) {
    const target = r.dup ? null : r.p;
    const fa = resolve(r.f, r, 'M', 'bố'), mo = resolve(r.m, r, 'F', 'mẹ');
    if (target) {
      for (const pr of [[fa, 'fatherId', 'bố'], [mo, 'motherId', 'mẹ']]) {
        const par = pr[0];
        if (!par) continue;
        if (par.id === target.id || isAnc(target.id, par.id)) { warnings.push('Dòng ' + r.ln + ' (' + target.name + '): bỏ qua liên kết ' + pr[2] + ' vì tạo vòng lặp.'); continue; }
        target[pr[1]] = par.id;
        const cur = parentOf.get(target.id) || ['', ''];
        if (pr[1] === 'fatherId') cur[0] = par.id; else cur[1] = par.id;
        parentOf.set(target.id, cur);
      }

/* ---------- tấm trượt ----------
   Khi có tấm đang mở, giữ đúng MỘT mốc trong lịch sử trình duyệt, để nút Quay lại của điện thoại
   đóng tấm trên cùng thay vì rời trang. Không bao giờ vừa lùi vừa thêm mốc cùng lúc (trình duyệt
   xử lý hai việc đó không theo thứ tự cố định), nên việc lùi được hoãn tới cuối lượt. */
const Sheets = {
  stack: [], ignore: 0, guard: false, syncT: 0, ignT: 0,
  open: function (opt) {
    const ov = document.createElement('div');
    ov.className = 'ov' + (opt.dlg ? ' mid' : '');
    setHTML(ov, html`<div class="sh ${opt.dlg ? 'dlg' : ''} ${opt.full ? 'full' : ''} ${opt.cls || ''}" role="dialog" aria-modal="true" aria-label="${opt.title || ''}">
      <div class="sh-h"><h2>${opt.title || ''}</h2>${opt.actions || ''}<button class="ib" data-act="close" aria-label="Đóng">${icon('x')}</button></div>
      <div class="sh-b">${opt.body || ''}</div>
      ${opt.foot ? html`<div class="sh-f">${opt.foot}</div>` : ''}</div>`);
    const entry = { node: ov, opt: opt };
    const self = this;
    ov.addEventListener('click', function (ev) {
      if (ev.target === ov) { if (!opt.sticky) self.close(entry); return; }
      const t = ev.target.closest('[data-act]');
      if (!t || !ov.contains(t)) return;
      const act = t.getAttribute('data-act');
      if (act === 'close') { self.close(entry); return; }
      const fn = opt.on && opt.on[act];
      if (fn) fn(t, ev, entry);
    });
    $('#sheets').appendChild(ov);
    this.stack.push(entry);
    this.ensureGuard();
    entry.body = $('.sh-b', ov); entry.el = ov;
    entry.close = function () { self.close(entry); };
    const f = opt.focus !== false && $('[autofocus]', ov);
    if (f) setTimeout(function () { try { f.focus(); } catch (e) { /* bỏ qua */ } }, 60);
    return entry;
  },
  ensureGuard: function () {
    if (this.guard || !this.stack.length || this.ignore > 0) return;
    try { history.pushState({ gp: 1 }, ''); this.guard = true; } catch (e) { /* bỏ qua */ }
  },
  close: function (entry, fromPop) {
    if (!this.stack.length) return false;
    if (entry && this.stack.indexOf(entry) < 0) return false;
    entry = entry || this.stack[this.stack.length - 1];
    const gone = [];
    while (this.stack.length) { const top = this.stack.pop(); gone.push(top); if (top === entry) break; }
    gone.forEach(function (top) {
      top.node.remove();
      if (top.opt.onClose) { try { top.opt.onClose(); } catch (e) { console.error(e); } }
    });
    if (!fromPop) this.scheduleSync();
    return true;
  },
  scheduleSync: function () {
    const self = this;
    clearTimeout(this.syncT);
    this.syncT = setTimeout(function () {
      if (self.stack.length || !self.guard) return;
      self.guard = false; self.ignore++;
      clearTimeout(self.ignT);
      self.ignT = setTimeout(function () { if (self.ignore > 0) { self.ignore = 0; self.ensureGuard(); } }, 1000);
      try { history.back(); } catch (e) { self.ignore = 0; }
    }, 0);
  },
  closeAll: function () { while (this.stack.length) this.close(this.stack[this.stack.length - 1]); }
};
window.addEventListener('popstate', function () {
  if (Sheets.ignore > 0) { Sheets.ignore--; Sheets.ensureGuard(); return; }
  Sheets.guard = false;
  if (Sheets.stack.length) { Sheets.close(Sheets.stack[Sheets.stack.length - 1], true); Sheets.ensureGuard(); }
});

/* Lưu tệp lớn (ảnh) giữ nguyên từng byte. APK: gửi sang Android từng đoạn 384 KB (chia hết cho 3 nên mỗi đoạn base64
   tự giải mã được), ảnh vào thư viện ảnh Pictures/GiaPha. Trình duyệt: tải xuống thẳng từ Blob, không chép thêm lần nào. */

/* ===== ui-photo.js — ảnh chân dung: chọn khung mặt, xem ảnh đầy đủ, lưu gọn trong Firestore =====
   Mỗi người có hai thứ:
   - photo: ảnh đại diện vuông 288 px (WebP, máy không mã hóa được WebP thì JPEG) nằm ngay trong hồ sơ, vẽ trên cây và danh sách;
   - img:   phần mô tả ẢNH ĐẦY ĐỦ đã nén (cạnh dài tối đa 1600 px, cố giữ dưới 350 KB) — đủ phóng to xem rõ mặt mũi.
            Bản thân ảnh nằm riêng: trên máy ở IndexedDB khóa 'ph:'+id; trên mạng ở trees/{cây}/photos/{id} (mô tả nhỏ)
            + photos/{id}/c/0 (dữ liệu ảnh kiểu Bytes). Ảnh lưu từ bản 1.0.6 (ảnh gốc nhiều mảnh) được tự nén lại cho gọn.
   Gói Firestore miễn phí 1 GiB chứa được vài nghìn ảnh cỡ này, không cần Firebase Storage hay Google Drive. */
const PH_CHUNK = 900 * 1024;

const PH_TARGET = 350 * 1024;            // cố giữ mỗi ảnh dưới mức này
const AV_SIZE = 288;                     // ảnh đại diện vuông

  const s = function (a, b) { return String.fromCharCode.apply(null, u8.subarray(a, b)); };
  if (u8.length < 12) return '';
  if (u8[0] === 0xFF && u8[1] === 0xD8 && u8[2] === 0xFF) return 'image/jpeg';
  if (u8[0] === 0x89 && s(1, 4) === 'PNG') return 'image/png';
  if (s(0, 4) === 'RIFF' && s(8, 12) === 'WEBP') return 'image/webp';
  if (s(0, 4) === 'GIF8') return 'image/gif';
  if (s(4, 8) === 'ftyp') { const b = s(8, 12); return b === 'avif' || b === 'avis' ? 'image/avif' : 'image/heic'; }
  if (s(0, 2) === 'BM') return 'image/bmp';
  return '';
}
function phStamp() { const d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); }

  n = String(n || '').split(/[\\/]/).pop().replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').trim().slice(0, 100);
  if (!n || /^(image|blob)$/i.test(n)) n = (hint || 'Anh') + '_' + phStamp();
  if (!/\.[a-z0-9]{2,5}$/i.test(n)) n += ext;

}
function dataUrlBytes(d) { const s = atob(String(d).split(',')[1] || ''), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }

/* thu nhỏ từng nửa một rồi mới về cỡ đích cho nét, nền trắng (ảnh PNG trong suốt) */
function phDraw(src, w, h) {
  const sz = natSize(src);
  let cur = src, cw = sz.w, ch = sz.h;
  while (cw / 2 >= w && ch / 2 >= h) {
    const t = document.createElement('canvas');
    t.width = Math.round(cw / 2); t.height = Math.round(ch / 2);
    const g2 = t.getContext('2d'); g2.imageSmoothingQuality = 'high'; g2.drawImage(cur, 0, 0, t.width, t.height);
    cur = t; cw = t.width; ch = t.height;

  out.width = w; out.height = h;
  const g = out.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, w, h);

/* Kéo, chụm hai ngón, cuộn chuột, chạm đúp — dùng chung cho khung chọn mặt và màn xem ảnh */
function gest(el, h) {
  const pts = new Map();
  let pinch = null, moved = 0, tapT = 0, tapX = 0, tapY = 0;
  const pos = function (e) { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const two = function () { const a = Array.from(pts.values()); return { d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y) || 1, x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 }; };
  el.addEventListener('pointerdown', function (e) {
    if (e.button > 0) return;
    try { el.setPointerCapture(e.pointerId); } catch (x) { /* bỏ qua */ }
    pts.set(e.pointerId, pos(e));
    if (pts.size === 1) moved = 0;
    if (pts.size === 2) pinch = two();
    el.classList.add('drag');
  });
  el.addEventListener('pointermove', function (e) {
    const q = pts.get(e.pointerId); if (!q) return;
    const p = pos(e); pts.set(e.pointerId, p);
    if (pts.size === 1) { moved += Math.abs(p.x - q.x) + Math.abs(p.y - q.y); h.pan(p.x - q.x, p.y - q.y); }
    else if (pts.size === 2 && pinch) { const n = two(); moved += 20; h.zoom(n.d / pinch.d, n.x, n.y, n.x - pinch.x, n.y - pinch.y); pinch = n; }
  });
  const up = function (e) {
    if (!pts.has(e.pointerId)) return;
    const p = pos(e);
    pts.delete(e.pointerId);
    pinch = pts.size === 2 ? two() : null;
    if (pts.size) return;
    el.classList.remove('drag');
    if (e.type !== 'pointerup' || moved > 10) return;
    const now = Date.now();
    if (now - tapT < 330 && Math.abs(p.x - tapX) < 32 && Math.abs(p.y - tapY) < 32) { tapT = 0; if (h.dbl) h.dbl(p.x, p.y); }
    else { tapT = now; tapX = p.x; tapY = p.y; }
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('wheel', function (e) { e.preventDefault(); const p = pos(e); h.zoom(Math.exp(-Math.max(-60, Math.min(60, e.deltaY)) * 0.006), p.x, p.y, 0, 0); }, { passive: false });

    const k = e.key, st = 24;
    if (k === '+' || k === '=') h.zoom(1.25, el.clientWidth / 2, el.clientHeight / 2, 0, 0);
    else if (k === '-' || k === '_') h.zoom(0.8, el.clientWidth / 2, el.clientHeight / 2, 0, 0);
    else if (k === 'ArrowLeft') h.pan(st, 0); else if (k === 'ArrowRight') h.pan(-st, 0);
    else if (k === 'ArrowUp') h.pan(0, st); else if (k === 'ArrowDown') h.pan(0, -st);

/* ---------- xem ảnh lớn ----------

/* ===== Bộ đọc mã QR: camera trực tiếp và ảnh có sẵn =====
   Làm theo bộ quét đã chạy tốt ở app Quét QR CCCD và Scanner Pro, thêm ZXing:
   - Mã QR trên căn cước rộng ~2 cm với ~50–57 ô. Muốn đọc chắc cần ≥ 2,6 điểm ảnh mỗi ô, nên camera
     mở 2560 px, tự phóng 2× khi máy cho phép, và vùng quét giữ nguyên độ phân giải thật.
     (Bản cũ co cả khung về 820 px trước khi giải mã: mã chỉ còn ~1 điểm ảnh mỗi ô nên gần như không đọc được.)
   - Ba bộ giải mã chạy song song, bộ nào ra trước lấy bộ đó:
     1. BarcodeDetector có sẵn trong Chrome Android: gọi rồi đi tiếp, không chờ (có máy mất cả giây mỗi khung,
        chờ nó là treo cả vòng quét); chậm quá thì tự tắt.
     2. ZXing (WebAssembly): khỏe nhất với mã nhỏ, mờ, nghiêng. Bản APK có sẵn trong gói cài; bản web tải
        một lần từ jsDelivr rồi cất trong máy.
     3. jsQR (nhúng sẵn trong tệp): luôn có. Quét ô vuông giữa khung ở độ phân giải thật, phóng 2× khi mã nhỏ.
   - Mọi lần giải mã đều bọc try/catch: jsQR ném lỗi ở vài khung hình nhiễu, không bọc là chết vòng quét. */
const ZX_VER = '3.1.7';
const ZX_CDN = 'https://cdn.jsdelivr.net/npm/zxing-wasm@' + ZX_VER + '/dist/reader/zxing_reader.wasm';
const QRE = {
  bd: null, bdP: null, zxOk: false, zxP: null,
  initBD: function () {
    if (this.bdP) return this.bdP;
    const self = this;
    this.bdP = !('BarcodeDetector' in window) ? Promise.resolve(null)
      : Promise.resolve().then(function () { return window.BarcodeDetector.getSupportedFormats(); }).then(function (f) {
        if (f && f.indexOf('qr_code') >= 0) self.bd = new window.BarcodeDetector({ formats: ['qr_code'] });
        return self.bd;
      }).catch(function () { return null; });
    return this.bdP;
  },
  initZX: function () {

    const boot = function (buf) { return Z.prepareZXingModule({ overrides: { wasmBinary: buf }, fireImmediately: true }); };
    const fetchBuf = function () {
      return fetch(A ? location.origin + '/zxing/zxing_reader.wasm' : (window.GP_ZXING_URL || ZX_CDN)).then(function (r) {
        if (!r.ok) throw new Error('zxing ' + r.status);

      });
    };
    this.zxP = (A || !DB.idb ? Promise.resolve(null) : DB.get(key)).then(function (cached) {

      return false;
    }).then(function (ok) {
      if (ok) return true;
      return fetchBuf().then(function (buf) {
        return boot(buf).then(function () {
          if (!A && DB.idb) { try { DB.idb.transaction('kv', 'readwrite').objectStore('kv').put(buf, key); } catch (e) { /* bỏ qua */ } }

        });
      });
    }).then(function () { self.zxOk = true; return true; }, function () { self.zxP = null; return false; });   // lỗi mạng: lần sau thử lại
    return this.zxP;
  },

function qrClean(s) {

async function decodeQrImage(src, budget) {

      const k = Math.min(1, side / Math.max(W, H));
      try { const t = await zxRead(qrGrab(cv, src, 0, 0, W, H, k)); if (t) return qrClean(t); } catch (e) { /* thử tiếp */ }
    }
  }
  /* jsQR: cả ảnh (mã to), rồi từng ô vuông ở độ phân giải thật, phóng 1,4× (jsQR đọc mã nhỏ tốt hơn hẳn khi phóng nhẹ).
     Đi từ góc trên bên phải trước: chỗ mã QR ở mặt trước thẻ gắn chip. */

/* Quét liên tục trên thẻ <video>. o.roi: cạnh ô vuông so với cạnh ngắn phần đang hiện;

    cB.getContext('2d').drawImage(v, r[0], r[1], r[2], r[3], 0, 0, dw, dh);
    st.bdBusy = true;
    const t0 = Date.now();
    QRE.bd.detect(cB).then(function (res) {

  return {
    stop: function () { st.on = false; },
    side: function () { const cw = v.clientWidth, ch = v.clientHeight; return Math.round(Math.min(cw, ch) * roi); },
    count: function () { return st.n; }
  };
}

const PZ = {

    if (!lay || !bar) return;

    Array.prototype.forEach.call(bar.children, function (el, i) {

  },
  center: function (id) {

    const c = lay.cards.find(function (q) { return q.id === id && q.role === 'main' && !q.ref; }) || lay.cards.find(function (q) { return q.id === id; });

  }
};

    const ord = c.nsp > 1 ? (sexOf(p) === 'M' ? 'chồng ' : 'vợ ') + GP.spOrd(c.ord, c.nsp, sexOf(p) || 'F') : '';
    h += html`<div class="pc ${c.role === 'spouse' ? 'sp' : ''} ${p.dead ? 'dead' : ''} ${c.ref ? 'ref' : ''} ${S.sel === p.id ? 'sel' : ''}" data-id="${p.id}" style="left:${c.x}px;top:${c.y}px" role="button" tabindex="0">${ord ? html`<span class="ordt">${ord}</span>` : ''}${av(p)}<span class="nm">${p.name || '(chưa có tên)'}</span><span class="yr">${GP.lifeSpan(p)}</span>${c.role === 'main' && c.nk && !c.ref ? html`<button class="tg ${c.collapsed ? 'c' : ''}" data-tg="${p.id}" aria-label="${c.collapsed ? 'Mở nhánh con cháu' : 'Thu gọn nhánh'}">${c.collapsed ? '+' + c.nk : '–'}</button>` : ''}</div>`.s;
  }
  const tc = $('#tc', host);

function showOnTree(id) {
  S.sel = id;

  if (!S.lay || !S.lay.cards.some(function (c) { return c.id === id; })) {
    /* người này không nằm dưới gốc đang xem: mở các nhánh đang gập, hoặc chuyển gốc */
    S.collapsed.clear();
    const lin = S.idx.lineage(id);
    const mr = mainRoot();
    S.viewRoot = (S.idx.descendants(mr).has(id) || mr === id || S.idx.spouses(id).some(function (s) { return s.id === mr || S.idx.descendants(mr).has(s.id); })) ? null : lin[0];

}
function chooseRoot() {
  const roots = S.idx.roots(), mr = mainRoot();
  const sh = Sheets.open({
    title: 'Xem cây từ ai?',
    body: html`<p class="muted sm" style="margin-bottom:12px">Cây vẽ con cháu của người được chọn làm gốc. Dưới đây là những người đứng đầu một nhánh, ví dụ cụ tổ bên nội và ông bà bên ngoại.</p>
      ${roots.map(function (p) {

        return html`<button class="row" data-act="pick" data-id="${p.id}">${av(p)}<span class="b"><span class="n">${p.name}</span><span class="s">${[S.idx.descCount(p.id) + ' con cháu', sp.length ? 'cùng ' + sp.join(', ') : '', p.id === mr ? 'gốc chính của cây' : ''].filter(Boolean).join(', ')}</span></span>${p.id === S.root ? icon('check') : ''}</button>`;
      })}
      <button class="btn block" data-act="other">${icon('search')}Chọn một người khác</button>`,

}

/* ---------- danh sách ---------- */
let listLimit = 300;
function renderList() {
  const host = $('#v-list');
  if (!S.tree || !S.people.size) { setHTML(host, html`<div class="empty"><h2>Danh sách</h2><p>${S.tree ? 'Cây chưa có ai.' : 'Chưa có cây gia phả nào.'}</p></div>`); return; }
  if (!$('#q', host)) {
    setHTML(host, html`<div class="searchbar">${icon('search')}<input class="in" id="q" type="search" placeholder="Tìm theo tên, số điện thoại, địa chỉ" autocomplete="off"></div><div class="pad" id="listBody"></div>`);
    $('#q', host).addEventListener('input', function (e) { S.q = e.target.value; listLimit = 300; fillList(); });
  }
  $('#q', host).value = S.q || '';
  fillList();
}
function fillList() {
  const q = S.q || '';
  let list = S.idx.all();
  if (GP.fold(q)) list = list.filter(function (p) { return GP.match(q, [p.name, p.phone, p.address, p.hometown, p.note].join(' ')); });
  const groups = new Map();
  for (const p of list) { const g = S.gen.get(p.id) || 0; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); }
  const keys = Array.from(groups.keys()).sort(function (a, b) { return (a || 999) - (b || 999); });
  let shown = 0; const out = [];
  for (const g of keys) {
    const arr = GP.sortSibs(groups.get(g));
    if (shown >= listLimit) break;
    out.push(html`<div class="gh">${g ? html`<span class="seal">Đời ${g}</span>` : 'Ngoài nhánh chính'}<small>${arr.length} người${g ? '' : ' (bên thông gia, bên ngoại…)'}</small></div>`);
    for (const p of arr) {
      if (shown++ >= listLimit) break;
      out.push(html`<button class="row ${p.dead ? 'dead' : ''}" data-id="${p.id}">${av(p)}<span class="b"><span class="n">${p.name || '(chưa có tên)'}</span><span class="s">${subLine(p)}</span></span>${!sexOf(p) ? html`<span class="chip q">chưa rõ nam/nữ</span>` : ''}</button>`);
    }
  }
  if (!list.length) out.push(html`<p class="muted center" style="padding:30px 0">Không tìm thấy ai khớp với “${S.q}”.</p>`);
  if (list.length > listLimit) out.push(html`<button class="btn block" id="moreRows">Hiện thêm (còn ${list.length - listLimit} người)</button>`);
  const body = $('#listBody');
  setHTML(body, out);
  const mb = $('#moreRows', body); if (mb) mb.onclick = function () { listLimit += 300; fillList(); };
}

/* ---------- quan hệ giữa hai người ---------- */
function firstName(p) { const t = String(p.name || '').trim().split(/\s+/); return t[t.length - 1] || p.name; }
function chainHTML(chain) {
  const out = [];
  chain.forEach(function (id, i) {
    const p = S.idx.get(id); if (!p) return;
    if (i) out.push(html`<span class="st">${S.idx.hopLabel(chain[i - 1], id)}${icon('go')}</span>`);
    out.push(html`<button data-id="${id}">${p.name}</button>`);
  });
  return html`<div class="chain">${out}</div>`;
}
function hintHTML(k) {
  if (!k || !k.hint) return '';
  const a = S.idx.get(k.hint[0]), b = S.idx.get(k.hint[1]);
  if (!a || !b) return '';
  return html`<div class="hint">${icon('info')}<span>Chưa đủ dữ liệu để biết ai là anh/chị, ai là em giữa <b>${a.name}</b> và <b>${b.name}</b>. Nhập năm sinh hoặc “con thứ” của hai người để ra đúng một cách gọi.</span></div>`;
}
function renderRel() {
  const host = $('#v-rel');
  if (!S.tree || S.people.size < 2) { setHTML(host, html`<div class="empty"><h2>Hai người là gì của nhau?</h2><p>Cần ít nhất hai người trong cây để tra quan hệ.</p></div>`); return; }
  const a = S.relA && S.idx.get(S.relA), b = S.relB && S.idx.get(S.relB);
  const slot = function (p, w) {
    return p ? html`<button class="pk" data-rel="${w}">${av(p)}<span class="n">${p.name}</span><span class="muted sm">${GP.lifeSpan(p)}</span></button>`
      : html`<button class="pk none" data-rel="${w}">${icon('user')}<span>Chọn người ${w === 'a' ? 'thứ nhất' : 'thứ hai'}</span></button>`;
  };
  let ans = '';
  if (a && b) {
    const r = S.idx.relation(a.id, b.id, { deep: true });
    if (r.kind === 'self') ans = html`<div class="hint">${icon('info')}<span>Đang chọn cùng một người. Hãy chọn hai người khác nhau.</span></div>`;
    else if (r.kind === 'none') ans = html`<div class="ans"><div><p class="q">${a.name} và ${b.name}</p><p class="kw s">chưa nối với nhau</p><p>Trong cây này chưa có đường nào nối hai người. Hãy khai thêm bố mẹ, vợ chồng của họ.</p></div></div>`;
    else {
      const long = function (t) { return t.length > 9 ? ' s' : ''; };
      ans = html`<div class="ans">
        <div><p class="q">${a.name} gọi ${b.name} là</p><p class="kw${long(r.ab.term)}">${r.ab.term}</p><p>${r.ab.desc}</p>${r.also ? html`<p class="muted sm">Ngoài ra còn có họ: ${r.also.ab.desc || r.also.ab.term}</p>` : ''}</div>
        <div><p class="q">${b.name} gọi ${a.name} là</p><p class="kw${long(r.ba.term)}">${r.ba.term}</p><p>${r.ba.desc}</p></div>
        ${r.chain && r.chain.length > 1 ? html`<div><p class="q" style="margin-bottom:8px">Đường nối trong cây</p>${chainHTML(r.chain)}</div>` : ''}
      </div>${hintHTML(r.ab.k)}`;
    }
  }
  setHTML(host, html`<div class="pad"><div class="pick2">${slot(a, 'a')}<button class="ib" data-rel="swap" aria-label="Đổi chỗ hai người" style="align-self:center">${icon('swap')}</button>${slot(b, 'b')}</div>
    ${ans || html`<p class="muted center" style="margin-top:22px">Chọn hai người để xem họ gọi nhau là gì: bác, chú, cô, cậu, dì, anh chị em họ, dâu rể, thông gia…</p>`}</div>`);
}
function relWith(id) { S.relA = id; S.relB = null; Sheets.closeAll(); setView('rel'); pickPerson({ title: 'So với ai?', exclude: [id] }).then(function (b) { if (b) { S.relB = b; renderRel(); } }); }

/* ---------- gắn sự kiện khung chính ---------- */
function bindShell() {
  $('#tabs').addEventListener('click', function (e) { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
  $('#treeBtn').addEventListener('click', function () { openTrees(); });
  $('#findBtn').addEventListener('click', function () { pickPerson({ title: 'Tìm người trong cây' }).then(function (id) { if (id) showOnTree(id); }); });
  $('#inboxBtn').addEventListener('click', function () { if (typeof Cloud !== 'undefined') Cloud.openInbox(); });
  $('#v-tree').addEventListener('click', function (e) {
    const t = e.target.closest('[data-go]'); if (!t) return;
    const go = t.getAttribute('data-go');
    if (go === 'newTree') newTree();
    else if (go === 'demo') makeDemo();
    else if (go === 'addFirst' || go === 'addPerson') openForm({});

    else if (go === 'root') chooseRoot();

    else if (go === 'zin' || go === 'zout') { const r = PZ.tv.getBoundingClientRect(); PZ.glide(); PZ.zoomAt(r.width / 2, r.height / 2, PZ.k * (go === 'zin' ? 1.3 : 1 / 1.3)); }
  });
  $('#v-list').addEventListener('click', function (e) { const r = e.target.closest('.row[data-id]'); if (r) openDetail(r.dataset.id); });
  $('#v-rel').addEventListener('click', function (e) {
    const c = e.target.closest('.chain button'); if (c) { openDetail(c.dataset.id); return; }
    const t = e.target.closest('[data-rel]'); if (!t) return;
    const w = t.getAttribute('data-rel');
    if (w === 'swap') { const x = S.relA; S.relA = S.relB; S.relB = x; renderRel(); return; }
    pickPerson({ title: w === 'a' ? 'Chọn người thứ nhất' : 'Chọn người thứ hai' }).then(function (id) { if (id) { if (w === 'a') S.relA = id; else S.relB = id; renderRel(); } });
  });
  window.addEventListener('resize', function () { if (S.view === 'tree' && PZ.tv) PZ.apply(); });
}

/* ---- ui-person.js ---- */
/* ===== ui-person.js — xem một người, nhập thông tin, chọn người, camera, QR, đọc ảnh căn cước ===== */

/* Ghi thay đổi: put = người cần lưu, del = id cần xóa */
function commit(put, del) {
  put = put || []; del = del || [];
  const cloud = !!(S.tree && S.tree.cloud && typeof Cloud !== 'undefined');
  /* thành viên (không có quyền sửa): chỉ ghi người mới thêm và các chỗ nối còn trống, phải tính trước khi đổi S.people */
  const member = cloud && !canEdit();
  if (member && (!canAdd() || del.some(function (id) { return !isMine(S.people.get(id)); }))) { toast('Bạn chỉ sửa, xóa được người do chính mình thêm. Với người khác, hãy gửi góp ý cho quản trị viên.', true); return Promise.resolve(); }
  const ops = member ? Cloud.memberOps(put, del) : null;
  if (cloud && Cloud.user) for (const p of put) if (!S.people.has(p.id) && !p.by) p.by = Cloud.user.uid;
  const drops = [];                            // ảnh bị thay hoặc bỏ: xóa khỏi kho cho nhẹ
  for (const p of put) { const o = S.people.get(p.id); if (o && o.img && (!p.img || p.img.id !== o.img.id)) drops.push(o.img); }
  for (const id of del) { const o = S.people.get(id); if (o && o.img) drops.push(o.img); }
  for (const p of put) S.people.set(p.id, p);
  for (const id of del) S.people.delete(id);
  if (S.tree) { S.tree.u = Date.now(); S.tree.n = S.people.size; saveMeta(); }
  savePeopleSoon();
  let job = Promise.resolve();
  if (cloud) job = (member ? Cloud.writeMember(S.tree.id, ops) : Cloud.write(S.tree.id, put, del)).catch(function (e) { toast('Chưa ghi được lên đám mây: ' + Cloud.errText(e), true); });
  if (drops.length) Photos.drop(S.tree, drops);
  refresh();
  return job;
}

/* quản trị viên thấy người nào do thành viên nào thêm vào, để soát lại */
function addedBy(p) {
  if (!p.by || !S.tree || !S.tree.cloud || typeof Cloud === 'undefined' || !Cloud.cur || !Cloud.user) return '';
  if (p.by === Cloud.user.uid) return Cloud.cur.role === 'viewer' ? html`${icon('user')}<div><div class="l">Người thêm vào cây</div><b>Bạn</b><div class="l">Bạn tự sửa, xóa được người này</div></div>` : '';
  if (Cloud.cur.role !== 'admin') return '';
  const m = (Cloud.cur.members || []).find(function (x) { return x.uid === p.by; });
  return html`${icon('user')}<div><div class="l">Người thêm vào cây</div><b>${m ? m.name || m.email || 'Thành viên' : 'Thành viên đã rời cây'}</b></div>`;
}
/* ---------- xem một người ---------- */
function deathText(p) {
  const l = GP.lunarOf(p.death);
  if (l) return GP.fmtDate(p.death) + ' (âm lịch: ' + GP.fmtLunar(l, true) + ')';
  return GP.fmtDate(p.death) || 'chưa rõ ngày';
}
function gioText(p) {
  const g = GP.gioOf(p);
  if (!g) return '';
  const nx = GP.nextGio(p);
  return g.d + ' tháng ' + g.m + ' âm lịch' + (nx ? '. Lần tới: ' + GP.fmtDate(nx.iso) + (nx.days === 0 ? ' (hôm nay)' : nx.days === 1 ? ' (ngày mai)' : ', còn ' + nx.days + ' ngày') + (nx.n ? ', ' + GP.gioLabel(nx.n) : '') : '');
}
function openDetail(id) {
  const p = S.idx.get(id);

  S.sel = id;

    })}`;
  });
  const parents = (f || m) ? html`${icon('rel')}<div><div class="l">Quan hệ nhân thân</div><b>Con ${f ? html`ông <a href="#" data-act="go" data-id="${f.id}">${f.name}</a>` : ''}${f && m ? ' và ' : ''}${m ? html`bà <a href="#" data-act="go" data-id="${m.id}">${m.name}</a>` : ''}</b>${p.order ? html`<div class="l">Con thứ ${p.order}</div>` : ''}</div>` : '';
  const sh = Sheets.open({
    kind: 'detail', title: 'Thông tin', full: true,
    body: html`<div class="who">${p.photo ? html`<button class="avb" data-act="photo" aria-label="Xem ảnh lớn của ${p.name}">${av(p, 'xl')}<span class="zm">${icon('zoom')}</span></button>` : av(p, 'lg')}<div><h3>${p.name || '(chưa có tên)'}</h3><p class="muted">${[sx === 'M' ? 'Nam' : sx === 'F' ? 'Nữ' : 'Chưa rõ nam/nữ', GP.lifeSpan(p), gen ? 'đời ' + gen : ''].filter(Boolean).join(', ')}</p></div></div>
      <div class="card"><div class="kv">
        ${line('cake', 'Ngày sinh', GP.fmtDate(p.birth))}${p.dead ? line('info', 'Đã mất', deathText(p)) : ''}${gioText(p) ? line('flag', 'Ngày giỗ', gioText(p)) : ''}
        ${line('home', 'Quê quán', p.hometown)}${line('pin', 'Địa chỉ hiện tại', p.address)}

      </div></div>

/* ---------- camera: quét QR hoặc chụp ảnh ---------- */
function cropScale(src, rx, ry, rw, rh, maxSide) {     // cắt vùng theo tỷ lệ rồi co về maxSide
  const w0 = src.videoWidth || src.naturalWidth || src.width, h0 = src.videoHeight || src.naturalHeight || src.height;
  const sx = rx * w0, sy = ry * h0, sw = rw * w0, sh = rh * h0;
  const k = Math.min(2.5, maxSide / Math.max(sw, sh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
/* Mở camera. mode 'qr' -> trả chuỗi đọc được; 'photo' -> trả Blob ảnh gốc (chụp hoặc chọn); 'card' -> trả canvas ảnh chụp.
   o.zoom: phóng ống kính lúc mở (mã QR căn cước nhỏ nên mặc định 2×), o.accept/o.reject: lọc loại mã */
function openCamera(o) {
  return new Promise(function (res) {
    const qrMode = o.mode === 'qr';
    let stream = null, out = null, alive = true, facing = o.facing || 'environment', torch = false, scan = null, caps = {}, zoom = 0, lastBad = '', focusT = 0;
    const sh = Sheets.open({
      title: o.title, full: true,
      body: html`<div class="cam ${o.mode === 'card' ? 'card' : ''}"><video playsinline muted autoplay></video>${o.mode !== 'photo' ? html`<div class="frame ${qrMode ? 'sq' : ''}"></div>` : ''}${o.mode !== 'qr' ? html`<button class="shut" data-act="shot" aria-label="Chụp"></button>` : ''}</div>
        <div class="zoomb" id="camZoom" hidden></div>
        <p class="sm center" id="camMsg" style="margin:10px 0 4px">${o.help || ''}</p>
        <p class="muted xs center" id="camStat" style="margin:0 0 10px"></p>
        <div class="btns" style="justify-content:center"><button class="btn sm" data-act="file">${icon('image')}Chọn ảnh có sẵn</button><button class="btn sm" data-act="flip">Đổi camera</button><button class="btn sm" data-act="torch" hidden>${icon('flash')}Đèn</button></div>`,
      on: {
        shot: function () {
          const v = $('video', sh.el); if (!v.videoWidth) return;
          if (o.mode !== 'photo') { out = toCanvas(v, 2600); sh.close(); return; }
          /* ảnh chân dung: xin ảnh chụp đủ độ phân giải của ống kính, máy không hỗ trợ thì lấy nguyên khung hình đang xem */
          const frame = toCanvas(v), tr = track();
          const grab = function () { return new Promise(function (r) { frame.toBlob(r, 'image/jpeg', 0.92); }); };
          let job;
          try { job = window.ImageCapture && tr ? Promise.race([new window.ImageCapture(tr).takePhoto(), new Promise(function (_, rej) { setTimeout(function () { rej(new Error('chậm')); }, 3500); })]) : grab(); } catch (e) { job = grab(); }
          msg('Đang chụp…');
          Promise.resolve(job).then(function (b) { return b && b.size ? b : grab(); }, grab).then(function (b) {
            if (!alive) return;
            if (b && b.size) { out = b; sh.close(); } else msg('Chưa chụp được, hãy thử lại.', true);
          });
        },
        flip: function () { facing = facing === 'environment' ? 'user' : 'environment'; start(); },
        torch: function (b) {
          const tr = track(); if (!tr) return;
          torch = !torch;
          tr.applyConstraints({ advanced: [{ torch: torch }] }).catch(function () { });
          b.classList.toggle('on', torch);
        },
        zoom: function (b) { setZoom(+b.dataset.z); },
        file: function () {
          pickFile('image/*').then(function (f) {
            if (!f) return;
            return loadImage(f).then(function (img) {
              if (o.mode === 'photo') { out = f; sh.close(); return; }
              if (!qrMode) { out = toCanvas(img, 2600); sh.close(); return; }
              msg('Đang tìm mã QR trong ảnh…');
              return decodeQrImage(img).then(function (txt) {
                if (txt && (!o.accept || o.accept(txt))) { out = txt; sh.close(); }
                else msg(txt ? (o.reject || 'Mã QR này không đúng loại cần quét.') : 'Không tìm thấy mã QR trong ảnh. Hãy chụp gần, rõ nét và đủ sáng hơn.', true);
              });
            });
          }).catch(function () { msg('Không mở được ảnh này.', true); });
        }
      },
      onClose: function () { alive = false; if (scan) scan.stop(); stop(); clearTimeout(focusT); res(out); }
    });
    const msg = function (t, bad) { const el = $('#camMsg', sh.el); if (el) { el.textContent = t; el.style.color = bad ? 'var(--son)' : ''; } };
    const track = function () { return stream && stream.getVideoTracks()[0]; };
    const stop = function () { if (scan) { scan.stop(); scan = null; } if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } };
    const v = $('video', sh.el), frame = $('.frame', sh.el);
    /* dòng nhỏ dưới camera: độ phân giải, mức phóng, bộ giải mã — để biết máy đang quét bằng gì */
    const stat = function () {
      const el = $('#camStat', sh.el); if (!el || !v.videoWidth) return;
      el.textContent = 'Camera ' + v.videoWidth + '×' + v.videoHeight + (zoom > 1 ? ' · phóng ' + (Math.round(zoom * 10) / 10) + '×' : '') + (qrMode ? ' · bộ đọc: ' + (QRE.names() || 'không có') + (QRE.zxP && !QRE.zxOk ? ' (đang tải ZXing…)' : '') : '');
    };
    /* ô vuông vẽ trên màn hình khớp đúng vùng đang giải mã */
    const sizeFrame = function () { if (qrMode && frame && scan) { const s = scan.side(); frame.style.width = frame.style.height = s + 'px'; } };
    const drawZoom = function () {
      const box = $('#camZoom', sh.el);
      if (!box) return;
      const zc = caps.zoom;
      if (!zc || !(zc.max > 1.2)) { box.hidden = true; return; }
      const steps = [1, 2, 3, 4].filter(function (z) { return z >= (zc.min || 1) && z <= zc.max + 0.01; });
      box.hidden = steps.length < 2;
      setHTML(box, html`${steps.map(function (z) { return html`<button class="chipb ${Math.abs(zoom - z) < 0.05 ? 'on' : ''}" data-act="zoom" data-z="${z}" aria-label="Phóng ${z} lần">${z}×</button>`; })}`);
    };
    const setZoom = function (z) {
      const tr = track(); if (!tr || !caps.zoom) return;
      z = Math.max(caps.zoom.min || 1, Math.min(caps.zoom.max, z));
      tr.applyConstraints({ advanced: [{ zoom: z }] }).then(function () { zoom = z; drawZoom(); stat(); }, function () { });
    };
    /* chạm vào hình để lấy nét lại */
    const refocus = function () {
      const tr = track(), fm = caps.focusMode || [];
      if (!tr || !fm.length) return;
      msg('Đang lấy nét…');
      const back = function () { if (fm.indexOf('continuous') >= 0) return tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); };
      const p = fm.indexOf('single-shot') >= 0 ? tr.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] })
        : fm.indexOf('manual') >= 0 ? tr.applyConstraints({ advanced: [{ focusMode: 'manual' }] }).then(back) : back();
      Promise.resolve(p).catch(function () { }).then(function () {
        clearTimeout(focusT);
        focusT = setTimeout(function () { if (alive) { if (fm.indexOf('single-shot') >= 0) back(); msg(o.help || ''); } }, 1500);
      });
    };
    v.addEventListener('click', refocus);
    v.addEventListener('loadedmetadata', function () { sizeFrame(); stat(); });
    window.addEventListener('resize', sizeFrame);
    const begin = function (st) {
      if (!alive) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = st;
      v.srcObject = st; v.play().catch(function () { });
      const tr = st.getVideoTracks()[0];
      caps = (tr && tr.getCapabilities) ? (tr.getCapabilities() || {}) : {};
      $('[data-act="torch"]', sh.el).hidden = !caps.torch;
      if ((caps.focusMode || []).indexOf('continuous') >= 0) tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () { });
      zoom = (tr.getSettings && tr.getSettings().zoom) || 1;
      drawZoom();
      if (qrMode && caps.zoom && facing === 'environment') setZoom(Math.min(o.zoom || 1, caps.zoom.max));
      if (qrMode) {
        scan = qrLive(v, {
          roi: 0.62, stat: stat,
          onHit: function (txt) {
            if (!o.accept || o.accept(txt)) {
              out = txt;
              if (frame) frame.classList.add('ok');
              try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) { /* bỏ qua */ }
              setTimeout(function () { sh.close(); }, 160);
              return true;
            }
            if (txt !== lastBad) { lastBad = txt; msg(o.reject || 'Mã QR này không đúng loại cần quét.', true); }
            return false;
          }
        });
        sizeFrame();
      }
      stat();
    };
    const start = function () {
      stop();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Máy này không mở được camera trong ứng dụng. Hãy bấm “Chọn ảnh có sẵn”.', true); return; }
      /* xin 2560 px (đủ điểm ảnh cho mã nhỏ), không được thì lùi dần */
      const tries = [{ width: { ideal: 2560 }, height: { ideal: 1440 }, resizeMode: { ideal: 'none' } }, { width: { ideal: 1920 }, height: { ideal: 1080 } }, {}];
      const go = function (i) {
        return navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign({ facingMode: { ideal: facing } }, tries[i]) }).then(begin, function (e) {
          const name = e && e.name;
          if (name === 'NotAllowedError' || name === 'SecurityError' || i >= tries.length - 1) throw e;
          return go(i + 1);
        });
      };
      go(0).catch(function () { msg('Chưa được cấp quyền dùng camera. Hãy cho phép, hoặc bấm “Chọn ảnh có sẵn”.', true); });
    };
    start();
  });
}

/* ---------- đọc chữ trên ảnh căn cước (Tesseract, tải khi cần) ---------- */
/* Bản web tải bộ nhận dạng từ CDN (lần đầu cần mạng). Bản APK đọc từ chính gói cài đặt:
   mọi tệp được tải ở luồng chính rồi đưa cho worker dưới dạng blob, nên worker không phải tự gọi mạng. */
const TESS_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js';
function tessLocal() { return !!(A || window.GP_TESS_LOCAL); }
function loadScript(url) {
  return new Promise(function (res, rej) {
    const s = document.createElement('script');
    s.src = url; s.onload = function () { res(); }; s.onerror = function () { s.remove(); rej(new Error('Không tải được ' + url)); };
    document.head.appendChild(s);
  });
}
function hasSimd() {
  try { return WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11])); } catch (e) { return false; }
}
function prepOcr(src) {                    // kênh sáng nhất (V): hoa văn màu nhạt đi, chữ đen giữ nguyên
  const c = cropScale(src, 0, 0, 1, 1, 1900);
  const g = c.getContext('2d', { willReadFrequently: true });
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  let lo = 255, hi = 0;
  for (let i = 0; i < d.length; i += 4) { const v = Math.max(d[i], d[i + 1], d[i + 2]); d[i] = v; if (v < lo) lo = v; if (v > hi) hi = v; }
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) { let v = (d[i] - lo) * 255 / span; v = v < 96 ? v * 0.6 : Math.min(255, v * 1.12); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  return c;
}
let tessFiles = null;
function tessBlobs() {
  if (tessFiles) return tessFiles;
  const base = location.origin + '/tess/';
  const get = function (u, asText) {
    return fetch(base + u).then(function (r) { if (!r.ok) throw new Error('Thiếu tệp ' + u); return asText ? r.text() : r.blob(); });
  };
  const core = hasSimd() ? 'tesseract-core-simd-lstm.wasm.js' : 'tesseract-core-lstm.wasm.js';
  tessFiles = Promise.all([get('worker.min.js', true), get('core/' + core, true), get('lang/vie.traineddata.gz', false)]).then(function (r) {
    const js = function (t) { return URL.createObjectURL(new Blob([t], { type: 'text/javascript' })); };
    /* phần sau dấu # bị bỏ qua khi đọc blob, nhưng giúp thư viện nhận đúng kiểu đường dẫn nó cần */
    return { workerPath: js(r[0]), corePath: js(r[1]) + '#core.js', langPath: URL.createObjectURL(r[2]) + '#' };
  });
  tessFiles.catch(function () { tessFiles = null; });
