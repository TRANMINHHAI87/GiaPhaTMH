}
async function ocrCanvas(canvas, onProg) {
  const local = tessLocal();
  if (!window.Tesseract) await loadScript(local ? location.origin + '/tess/tesseract.min.js' : TESS_CDN);
  const opt = { logger: function (m) { if (onProg) onProg(m); } };
  if (local) Object.assign(opt, await tessBlobs(), { workerBlobURL: false, cacheMethod: 'none' });
  const w = await window.Tesseract.createWorker('vie', 1, opt);

  finally { try { await w.terminate(); } catch (e) { /* bỏ qua */ } }
}
/* Chụp/chọn ảnh căn cước -> {name, birth, gender, hometown, address, father, mother} hoặc null */

/* Dòng giải thích cạnh ô ngày mất: đổi sang âm lịch ngay khi gõ */
function deathHint(raw) {
  const v = String(raw || '').trim();
  if (!v) return { t: 'Nhập ngày mất theo lịch dương, app tự đổi sang âm lịch.', full: false };
  const iso = GP.parseDate(v);
  if (iso === null) return { t: 'Ngày chưa đúng. Viết kiểu 20/08/2024 hoặc gõ liền 20082024.', bad: true, full: false };
  const l = GP.lunarOf(iso);
  if (!l) return { t: 'Mới có ' + (iso.length === 4 ? 'năm' : 'tháng và năm') + ', cần đủ ngày tháng năm để đổi sang âm lịch.', full: false };
  if (iso > GP.todayIso()) return { t: 'Ngày này còn ở tương lai.', bad: true, full: true };
  return { t: 'Âm lịch: ' + GP.fmtLunar(l, true) + '. Giỗ hằng năm vào ngày ' + l.d + ' tháng ' + l.m + ' âm lịch.', full: true };
}
/* gõ liền 8 số thì tự thêm dấu gạch chéo */
function autoSlash(input) {
  input.addEventListener('input', function () {
    const v = input.value.trim();
    if (/^\d{8}$/.test(v)) input.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4);
  });
}

        const g = gNow();
        const si = byName(d.spouse, g === 'M' ? 'F' : g === 'F' ? 'M' : '');
        if (fi && !st.fatherId) st.fatherId = fi;
        if (mi && !st.motherId) st.motherId = mi;
        if (si && st.spouseIds.indexOf(si) < 0) st.spouseIds.push(si);
        const said = [d.father ? 'bố: ' + d.father : '', d.mother ? 'mẹ: ' + d.mother : '', d.spouse ? 'vợ/chồng: ' + d.spouse : ''].filter(Boolean).join(', ');
        const miss = (d.father && !fi) || (d.mother && !mi) || (d.spouse && !si);
        st.hint = (label || 'Trên thẻ ghi') + ' ' + said + '.' + (miss ? ' Chưa tìm thấy đúng một người trùng tên trong cây, hãy chọn tay ở dưới.' : ' Đã tự nối với người trùng tên trong cây, hãy kiểm tra lại.');
      }
    }
    draw();
  };
  autoSlash($('#fBirth', el)); autoSlash($('#fDeath', el));
  $('#fDeath', el).addEventListener('input', drawDeath);
  $$('input[name="fLive"]', el).forEach(function (r) { r.addEventListener('change', function () { drawDeath(); if (deadNow()) setTimeout(function () { $('#fDeath', el).focus(); }, 50); }); });
  $('#fName', el).addEventListener('input', function () { if (!st.photo) draw(); });
  $$('input[name="fG"]', el).forEach(function (r) { r.addEventListener('change', draw); });
  $('#pf', el).addEventListener('submit', function (e) { e.preventDefault(); save(false); });
  draw();
  if (o.fill) fillFrom(o.fill, o.fillLabel);
  if (o.autoScan) scanCccd().then(function (d) { fillFrom(d); });

  function save(again) {
    const err = function (m, sel) {
      const e = $('#fErr', el); e.textContent = m; e.hidden = false;
      if (sel) { const i = $(sel, el); i.classList.add('bad'); i.scrollIntoView({ block: 'center' }); if (i.focus) i.focus(); } else e.scrollIntoView({ block: 'center' });
    };
    $$('.bad', el).forEach(function (x) { x.classList.remove('bad'); });
    $('#fErr', el).hidden = true;
    const name = $('#fName', el).value.replace(/\s+/g, ' ').trim();
    if (!name) return err('Hãy nhập họ và tên.', '#fName');
    const gender = gNow();
    if (!gender) return err('Hãy chọn Nam hoặc Nữ. Thiếu giới tính thì không tính được cách xưng hô.');
    const birth = GP.parseDate($('#fBirth', el).value);
    if (birth === null) return err('Ngày sinh chưa đúng. Viết kiểu 15/08/1950, 08/1950 hoặc chỉ 1950.', '#fBirth');
    const dead = deadNow();
    let death = '', gioD = 0, gioM = 0;
    if (dead) {
      death = GP.parseDate($('#fDeath', el).value);
      if (death === null) return err('Ngày mất chưa đúng. Viết kiểu 20/08/2024, hoặc chỉ năm 2024 nếu không nhớ ngày.', '#fDeath');
      if (death && GP.lunarOf(death) && death > GP.todayIso()) return err('Ngày mất đang ở tương lai.', '#fDeath');
      if (!GP.lunarOf(death)) {
        const ds = $('#fGD', el).value.trim(), ms = $('#fGM', el).value.trim();
        if (ds || ms) {
          if (!(+ds >= 1 && +ds <= 30 && +ms >= 1 && +ms <= 12)) return err('Ngày giỗ âm lịch chưa đúng: ngày từ 1 đến 30, tháng từ 1 đến 12.', '#fGD');
          gioD = +ds; gioM = +ms;
        }
      }
    }
    if (birth && death && GP.cmpIso(death, birth) < 0) return err('Ngày mất đang sớm hơn ngày sinh.', '#fDeath');
    const ord = parseInt($('#fOrd', el).value, 10);
    const np = Object.assign({}, p, {
      name: name, gender: gender, birth: birth, dead: dead, death: death || '', gioD: gioD, gioM: gioM, hometown: $('#fHome', el).value.trim(), address: $('#fAddr', el).value.trim(),
      phone: $('#fPhone', el).value.trim(), note: $('#fNote', el).value.trim(), order: ord > 0 && ord < 100 ? ord : 0, photo: st.photo
    });
    if (st.photo && st.img && !declare) np.img = st.img; else delete np.img;
    if (declare) {
      np.fatherName = $('#fFn', el).value.trim(); np.motherName = $('#fMn', el).value.trim(); np.spouseName = $('#fSn', el).value.trim();
      if (!np.fatherName && !np.motherName && !np.spouseName) return err('Hãy ghi ít nhất họ tên bố, mẹ hoặc vợ/chồng.', '#fFn');
      delete np.fatherId; delete np.motherId; delete np.spouseIds;
      const btn = $('[data-act="save"]', el); btn.disabled = true;
      Promise.resolve(o.onSubmit(np)).then(function () { sh.close(); }, function (e) { btn.disabled = false; err('Chưa gửi được: ' + (e && e.message ? e.message : 'lỗi mạng')); });
      return;
    }
    delete np.fatherName; delete np.motherName; delete np.spouseName;
    np.fatherId = st.fatherId; np.motherId = st.motherId; np.spouseIds = st.spouseIds.slice();
    if (np.fatherId && np.fatherId === np.motherId) return err('Bố và mẹ đang là cùng một người.');
    if (np.spouseIds.indexOf(np.fatherId) >= 0 || np.spouseIds.indexOf(np.motherId) >= 0) return err('Bố hoặc mẹ đang được chọn làm vợ/chồng. Hãy kiểm tra lại.');
    for (const pid of [np.fatherId, np.motherId]) if (pid && old && S.idx.wouldCycle(np.id, pid)) return err('Không thể chọn con cháu của chính người này làm bố mẹ.');
    if (needRel && !np.fatherId && !np.motherId && !np.spouseIds.length && !st.kids.length) {
      $('#fRelSec', el).scrollIntoView({ block: 'start' });
      return err('Chưa có quan hệ với ai trong cây. Hãy chọn bố, mẹ, vợ/chồng hoặc con của người này.');
    }
    const addKids = st.kids.filter(function (k) { return kids0.indexOf(k) < 0; });
    const removeKids = kids0.filter(function (k) { return st.kids.indexOf(k) < 0; });
    for (const k of addKids) {
      const why = GP.kidProblem(S.idx, np, k); if (why) return err(why);
      const kk = S.people.get(k), slot = gender === 'F' ? 'motherId' : 'fatherId', cur = kk && kk[slot];
      if (member && cur && cur !== np.id && !isMine(S.people.get(cur))) return err(kk.name + ' đã có ' + (slot === 'fatherId' ? 'bố' : 'mẹ') + ' trong cây. Thành viên chỉ nối được vào chỗ còn trống; muốn đổi, hãy gửi góp ý cho quản trị viên.');
    }
    const changed = GP.linkSave(S.people, np, { addKids: addKids, removeKids: removeKids, keepSpouses: member });
    Sheets.closeAll();
    if (np.img && st.u8) Photos.keep(S.tree, np.img, st.u8, np);            // ảnh mới: lưu vào máy, cây dùng chung thì tải lên
    else if (np.img && old && old.img && old.img.id === np.img.id && old.photo !== np.photo) Photos.touch(S.tree, np.img, np);
    commit(changed, []);
    if (o.onSaved) o.onSaved(np);
    toast('Đã lưu ' + name);
    if (again) { openForm({ preset: o.preset, title: o.title }); return; }
    if (S.view === 'tree') { S.sel = np.id; renderTree(); setTimeout(function () { if (!PZ.center(np.id)) showOnTree(np.id); }, 40); }
    else openDetail(np.id);
  }
  return sh;
}

/* ===== ui-data.js — quản lý các cây, nhập xuất, sao lưu, trang "Thêm" ===== */
function treeById(id) { return S.meta.trees.find(function (t) { return t.id === id; }) || null; }
function fileSlug(s) { return GP.fold(s).replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40) || 'giapha'; }
function today() { const d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; }; return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }

let switchSeq = 0;
async function switchTree(id) {
  const seq = ++switchSeq;                     // hai lần đổi cây chồng nhau: lần sau thắng, không trộn người của hai cây
  await flushPeople();
  if (seq !== switchSeq) return;
  if (typeof Cloud !== 'undefined') Cloud.detach();
  const t = treeById(id);
  S.tree = t; S.meta.cur = t ? t.id : '';
  S.viewRoot = null; S.collapsed = new Set(); S.sel = null; S.relA = S.relB = null; S.q = ''; S.lay = null;
  S.people = new Map();
  if (t) {
    const arr = await DB.get('p:' + t.id);
    if (seq !== switchSeq) return;
    const m = new Map();
    if (Array.isArray(arr)) for (const o of arr) { const p = cleanPerson(o); if (p) m.set(p.id, p); }
    S.people = m;
  }
  saveMeta(); PZ.homeKey = '';
  refresh();
  if (t && t.cloud && typeof Cloud !== 'undefined') Cloud.attach(t);
  else if (t) Photos.compactSoon(t);               // ảnh lưu từ bản 1.0.6 còn nguyên cỡ: nén lại cho gọn
}
function addLocalTree(name, people, extra) {
  const now = Date.now();
  const t = Object.assign({ id: 't' + GP.uid(19), name: name, note: '', rootId: '', cloud: false, role: 'admin', n: people ? people.length : 0, c: now, u: now }, extra || {});
  S.meta.trees.push(t);
  return DB.set('p:' + t.id, people || []).then(function () { return saveMeta(); }).then(function () { return t; });
}
function newTree() {
  return promptBox({ title: 'Tạo cây gia phả', label: 'Tên cây', ph: 'vd Họ Trần – bên nội', ok: 'Tạo cây', max: 80, help: 'Mỗi cây là một sổ riêng. Bên nội, bên ngoại nên tạo thành hai cây.' }).then(function (name) {
    if (!name) return null;
    return addLocalTree(name, []).then(function (t) { Sheets.closeAll(); return switchTree(t.id).then(function () { setView('tree'); toast('Đã tạo cây “' + name + '”'); return t; }); });
  });
}
function makeDemo() {
  const d = GP.demoPeople();
  return addLocalTree('Cây mẫu – họ Trần', d.people, { rootId: d.ids.to }).then(function (t) { Sheets.closeAll(); return switchTree(t.id).then(function () { setView('tree'); toast('Đây là cây mẫu với tên hư cấu. Bấm vào từng người để xem quan hệ.'); }); });
}
function removeTreeLocal(id) {
  S.meta.trees = S.meta.trees.filter(function (t) { return t.id !== id; });
  return DB.del('p:' + id).then(function () {
    Photos.gcSoon();                                 // ảnh của cây này không còn ai dùng
    if (S.meta.cur === id || !S.tree || S.tree.id === id) return switchTree(S.meta.trees[0] ? S.meta.trees[0].id : '');
    return saveMeta();
  });
}
function treeKind(t) {
  if (!t.cloud) return 'Lưu trên máy này';
  return 'Dùng chung qua mạng, ' + (t.role === 'admin' ? 'bạn là quản trị viên' : t.role === 'editor' ? 'bạn cùng quản trị' : t.mem ? 'bạn là thành viên' : 'bạn chỉ xem');
}
function openTrees() {
  const sh = Sheets.open({
    title: 'Các cây gia phả',
    body: html`${S.meta.trees.length ? S.meta.trees.map(function (t) {
      return html`<div class="row" style="padding-right:4px"><button data-act="open" data-id="${t.id}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left">${icon(t.cloud ? 'cloud' : 'book')}<span class="b"><span class="n">${t.name}</span><span class="s">${t.n || 0} người. ${treeKind(t)}</span></span>${S.tree && S.tree.id === t.id ? html`<span class="chip">đang mở</span>` : ''}</button><button class="ib" data-act="menu" data-id="${t.id}" aria-label="Tùy chọn cho cây ${t.name}">${icon('more')}</button></div>`;
    }) : html`<p class="muted" style="margin-bottom:12px">Chưa có cây nào.</p>`}
      <div class="btns" style="margin-top:12px"><button class="btn pri" data-act="new">${icon('plus')}Tạo cây mới</button><button class="btn" data-act="restore">${icon('up')}Mở tệp sao lưu</button>${S.meta.trees.length ? '' : html`<button class="btn" data-act="demo">Xem thử cây mẫu</button>`}</div>`,
    on: {
      open: function (t) { sh.close(); switchTree(t.dataset.id).then(function () { setView('tree'); }); },
      new: function () { newTree(); }, demo: function () { makeDemo(); }, restore: function () { restoreBackup(); },
      menu: function (t) { treeMenu(treeById(t.dataset.id)); }
    }
  });
}
function treeMenu(t) {
  if (!t) return;
  const admin = !t.cloud || t.role === 'admin';
  const c = Sheets.open({
    title: t.name,
    body: html`<div class="menu">
      ${admin ? html`<button data-act="rename">${icon('edit')}<span class="b"><span class="n">Đổi tên cây</span></span></button>` : ''}
      <button data-act="copy">${icon('copy')}<span class="b"><span class="n">Tạo bản sao trên máy này</span><span class="s">Bản sao là một cây riêng, không ảnh hưởng cây gốc</span></span></button>
      <button data-act="del" style="color:var(--son)">${icon('trash')}<span class="b"><span class="n">${t.cloud && !admin ? 'Rời khỏi cây này' : 'Xóa cây'}</span><span class="s">${t.cloud && admin ? 'Xóa cả trên mạng, mọi thành viên sẽ không xem được nữa' : t.cloud ? 'Chỉ gỡ khỏi máy này, cây trên mạng vẫn còn' : 'Xóa toàn bộ người trong cây này khỏi máy'}</span></span></button></div>`,
    on: {
      rename: function () {
        promptBox({ title: 'Đổi tên cây', label: 'Tên cây', value: t.name, max: 80 }).then(function (name) {
          if (!name) return;
          t.name = name; t.u = Date.now(); saveMeta(); if (t.cloud) Cloud.patchTree(t.id, { name: name });
          Sheets.closeAll(); renderHeader(); openTrees();
        });
      },
      copy: function () {
        DB.get('p:' + t.id).then(function (arr) {
          const people = (S.tree && S.tree.id === t.id ? Array.from(S.people.values()) : (arr || [])).map(function (p) { return Object.assign({}, p); });
          return addLocalTree(t.name + ' (bản sao)', people, { rootId: t.rootId || '' });
        }).then(function (nt) { Sheets.closeAll(); switchTree(nt.id).then(function () { toast('Đã tạo bản sao trên máy'); }); });
      },
      del: function () {
        const leave = t.cloud && !admin;
        confirmBox({
          title: leave ? 'Rời khỏi cây này?' : 'Xóa cây “' + t.name + '”?', danger: true, ok: leave ? 'Rời khỏi' : 'Xóa cây',
          text: leave ? 'Cây sẽ biến mất khỏi danh sách của bạn. Muốn xem lại, bạn mở lại đường link được mời.' : 'Toàn bộ ' + (t.n || 0) + ' người trong cây này sẽ bị xóa' + (t.cloud ? ' ở cả trên mạng lẫn trên máy.' : ' khỏi máy.'),
          more: leave ? '' : 'Nên sao lưu ra tệp trước khi xóa. Thao tác này không hoàn lại được.'
        }).then(function (yes) {
          if (!yes) return;
          const job = t.cloud ? (admin ? Cloud.deleteTree(t.id) : Cloud.leaveTree(t.id)) : Promise.resolve();
          job.then(function () { return removeTreeLocal(t.id); }).then(function () { Sheets.closeAll(); setView('tree'); toast(leave ? 'Đã rời khỏi cây' : 'Đã xóa cây'); })
            .catch(function (e) { toast('Chưa xóa được: ' + (typeof Cloud !== 'undefined' ? Cloud.errText(e) : e.message), true); });
        });
      }
    }
  });
  return c;
}

function downloadTemplate() {

}

function importExcel() {

      <div class="sec">Một vài người đầu tiên</div>${r.add.slice(0, 6).map(function (p) { return html`<div class="row flat">${av(p)}<span class="b"><span class="n">${p.name}</span><span class="s">${[GP.fmtDate(p.birth), p.hometown].filter(Boolean).join(', ')}</span></span></div>`; })}`,

/* ---------- sao lưu / khôi phục ---------- */
function backupTree() {
  if (!S.tree) { toast('Chưa có cây nào để sao lưu.', true); return; }
  const data = { app: 'giapha', v: 1, when: Date.now(), tree: { name: S.tree.name, note: S.tree.note || '', rootId: S.tree.rootId || '' }, people: Array.from(S.people.values()) };
  saveFile('SaoLuu_' + fileSlug(S.tree.name) + '_' + today() + '.json', 'application/json', JSON.stringify(data));
}
function backupAll() {
  flushPeople().then(function () {
    return Promise.all(S.meta.trees.map(function (t) {
      return (S.tree && S.tree.id === t.id ? Promise.resolve(Array.from(S.people.values())) : DB.get('p:' + t.id)).then(function (arr) {
        return { tree: { name: t.name, note: t.note || '', rootId: t.rootId || '' }, people: Array.isArray(arr) ? arr : [] };
      });
    }));
  }).then(function (packs) {
    if (!packs.length) { toast('Chưa có cây nào để sao lưu.', true); return; }
    saveFile('SaoLuu_tat_ca_' + today() + '.json', 'application/json', JSON.stringify({ app: 'giapha', v: 1, when: Date.now(), trees: packs }));
  });
}
function restoreBackup() {
  pickFile('.json,application/json').then(function (f) {
    if (!f) return;
    return readText(f).then(function (txt) {
      let d; try { d = JSON.parse(txt); } catch (e) { d = null; }
      const packs = d && d.app === 'giapha' ? (Array.isArray(d.trees) ? d.trees : [d]) : [];
      const good = packs.filter(function (x) { return x && x.tree && Array.isArray(x.people); });
      if (!good.length) { toast('Tệp này không phải tệp sao lưu của ứng dụng Gia Phả.', true); return; }
      let job = Promise.resolve(null);

      });
      return job.then(function (t) { Sheets.closeAll(); return switchTree(t.id).then(function () { setView('tree'); toast('Đã khôi phục thành một cây mới trên máy'); }); });
    });
  }).catch(function () { toast('Không đọc được tệp sao lưu.', true); });
}

function b64url(s) { return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64url(s) { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function parseCfg(txt) {
  const out = {}, re = /["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)["']?\s*:\s*["']([^"'\s]+)["']/g;
  let m; while ((m = re.exec(String(txt)))) out[m[1]] = m[2];
  return out.apiKey && out.projectId && out.appId ? out : null;
}
let BAKED;
function bakedCfg() {                       // cấu hình dán sẵn trong tệp HTML
  if (BAKED === undefined) { const el = document.getElementById('gp-config'); BAKED = el ? parseCfg(el.textContent) : null; }
  return BAKED;
}
function okCfg(c) { return !!(c && typeof c === 'object' && typeof c.apiKey === 'string' && typeof c.projectId === 'string' && typeof c.appId === 'string'); }
function inAppBrowser() {                  // trình duyệt riêng của Zalo, Facebook, Messenger, TikTok…: Google không cho đăng nhập ở đó
  if (A) return false;

  return /iPhone|iPad|iPod/i.test(ua) && !/Safari\//.test(ua) && !navigator.standalone;    // iPhone: ứng dụng nhúng trang, không phải Safari
}
function onWeb() { return !A && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'); }
function webBase() { return onWeb() ? location.origin + location.pathname : (S.meta.webUrl || ''); }
/* Link mời dùng tham số ?join= : không bị rơi mất khi mở qua Zalo hay khi chuyển sang Chrome/Safari.
   Link kiểu cũ #join= vẫn đọc được. */
function packCfg(c) { return b64url(JSON.stringify({ a: c.apiKey, d: c.authDomain || '', p: c.projectId, i: c.appId })); }
function unpackCfg(enc) {
  let o = null;
  try { o = JSON.parse(unb64url(enc)); } catch (e) { return null; }
  if (o && o.a) o = { apiKey: o.a, authDomain: o.d || '', projectId: o.p, appId: o.i };
  return okCfg(o) ? { apiKey: o.apiKey, authDomain: o.authDomain || '', projectId: o.projectId, appId: o.appId, storageBucket: o.storageBucket || '', messagingSenderId: o.messagingSenderId || '' } : null;
}
function inviteLink(base, id, name) {
  const cfg = Cloud.cfg();
  return base + '?join=' + id + (name ? '&n=' + encodeURIComponent(name) : '') + (cfg && !bakedCfg() ? '&c=' + packCfg(cfg) : '');
}
function parseInvite(txt) {                // nhận cả link mới (?join=) lẫn link cũ (#join=), kể cả khi dán nguyên tin nhắn có link
  txt = String(txt || '');
  const urls = txt.match(/https?:\/\/[^\s"'<>]+/gi) || [];
  const src = urls.find(function (u) { return /[?#&]join=/.test(u); }) || txt;
  const g = function (k) {
    const m = new RegExp('[?#&]' + k + '=([^&#\\s]+)').exec(src);
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  };
  const id = g('join');
  if (!/^[a-z0-9]{8,40}$/i.test(id)) return null;
  const base = /^https:\/\/[^?#\s]+/i.exec(src);
  return { id: id, name: g('n').slice(0, 80), c: g('c'), base: base ? base[0] : '' };
}
/* Ảnh mã QR (kèm tên cây bên dưới) */
function qrCanvas(text, caption) {
  const qr = window.qrcode(0, 'M');
  qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = Math.max(4, Math.floor(640 / (n + 8))), q = 4 * cell, W = n * cell + q * 2, H = W + (caption ? 128 : 0);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#221F1C';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) g.fillRect(q + k * cell, q + r * cell, cell, cell);
  if (caption) {
    g.textAlign = 'center';
    g.fillStyle = '#C2362B'; g.font = '700 44px Charm, Georgia, serif'; g.fillText(caption, W / 2, W + 46, W - 40);
    g.fillStyle = '#5E574E'; g.font = '500 24px "Be Vietnam Pro", Arial, sans-serif'; g.fillText('Quét bằng camera điện thoại để mở gia phả', W / 2, W + 92, W - 40);
  }
  return c;
}

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() { return request.auth != null; }
    function me() { return request.auth.uid; }
    function hasEmail() { return signedIn() && request.auth.token.get('email', '') != '' && request.auth.token.get('email_verified', false) == true; }
    function myEmail() { return request.auth.token.email.lower(); }
    function tree(t) { return get(/databases/$(database)/documents/trees/$(t)).data; }
    function memberPath(t) { return /databases/$(database)/documents/trees/$(t)/members/$(me()); }
    function invitePath(t) { return /databases/$(database)/documents/invites/$(myEmail() + '__' + t); }
    function isOwner(t) { return signedIn() && tree(t).ownerUid == me(); }
    function member(t) { return get(memberPath(t)).data; }
    function approved(t) { return exists(memberPath(t)) && member(t).get('status', '') == 'approved'; }
    function invited(t) { return hasEmail() && exists(invitePath(t)); }
    // quản trị viên (chủ cây) và người cùng quản trị sửa được mọi thứ;
    // thành viên đã duyệt: thêm người mới, sửa / xóa người do chính mình thêm (trường by), người khác thì chỉ nối thêm
    function canEdit(t) { return isOwner(t) || (signedIn() && approved(t) && member(t).get('role', '') == 'editor'); }
    function canAdd(t) { return canEdit(t) || (signedIn() && approved(t)); }
    function canView(t) { return isOwner(t) || (signedIn() && (tree(t).get('open', false) == true || approved(t))); }
    function personPath(t, p) { return /databases/$(database)/documents/trees/$(t)/people/$(p); }
    // người do chính mình thêm: trước lần ghi này / sau lần ghi này (kể cả người vừa thêm trong cùng lần ghi)
    function mineBefore(t, p) { return p is string && p != '' && exists(personPath(t, p)) && get(personPath(t, p)).data.get('by', '') == me(); }
    function mineAfter(t, p) { return p is string && p != '' && existsAfter(personPath(t, p)) && getAfter(personPath(t, p)).data.get('by', '') == me(); }
    function myDoc() { return resource.data.get('by', '') == me() && request.resource.data.get('by', '') == me(); }
    // ô bố/mẹ của người khác: chỉ đổi giữa trống và người của mình
    function slotOk(t, x, y) { return (x == '' || mineBefore(t, x)) && (y == '' || mineAfter(t, y)); }
    // thành viên ghi vào người không phải của mình: chỉ nối thêm hoặc gỡ một người của mình, không đổi thứ tự vợ chồng, không sửa gì khác
    function linkOnly(t) {
      let o = resource.data;
      let d = request.resource.data;
      let k = d.diff(o).affectedKeys();
      let a = o.get('spouseIds', []);
      let b = d.get('spouseIds', []);
      let add = b.removeAll(a);
      let rem = a.removeAll(b);
      return k.hasOnly(['spouseIds', 'fatherId', 'motherId', 'u'])
        && (!('fatherId' in k) || slotOk(t, o.get('fatherId', ''), d.get('fatherId', '')))
        && (!('motherId' in k) || slotOk(t, o.get('motherId', ''), d.get('motherId', '')))
        && (!('spouseIds' in k) || (add.size() <= 1 && rem.size() <= 1 && b.removeAll(add) == a.removeAll(rem)
            && (add.size() == 0 || mineAfter(t, add[0])) && (rem.size() == 0 || mineBefore(t, rem[0]))));
    }

    match /users/{u} {
      allow read, write: if signedIn() && me() == u;
    }
    match /trees/{t} {
      allow get: if signedIn();
      allow list: if signedIn() && resource.data.ownerUid == me();
      allow create: if signedIn() && request.resource.data.ownerUid == me();
      allow update: if signedIn() && resource.data.ownerUid == me() && request.resource.data.ownerUid == me();
      // chủ cây được sửa tên, gốc, chế độ mở; không ai khác sửa được
      allow delete: if signedIn() && resource.data.ownerUid == me();

      match /people/{p} {
        allow read: if canView(t);
        allow create: if canEdit(t) || (canAdd(t) && request.resource.data.get('by', '') == me());
        allow update: if canEdit(t) || (canAdd(t) && (myDoc() || linkOnly(t)));
        allow delete: if canEdit(t) || (canAdd(t) && resource.data.get('by', '') == me());
      }
      match /members/{m} {
        allow read: if isOwner(t) || (signedIn() && me() == m);
        // tự xin vào (chờ duyệt), hoặc đã được quản trị viên mời bằng email thì vào thẳng
        allow create: if signedIn() && me() == m && (
                        (request.resource.data.status == 'pending' && request.resource.data.role == 'viewer')
                        || (invited(t) && request.resource.data.status == 'approved'
                            && request.resource.data.role == get(invitePath(t)).data.role));
        allow update: if isOwner(t) || (signedIn() && me() == m
                      && request.resource.data.status == resource.data.status
                      && request.resource.data.role == resource.data.role);
        allow delete: if isOwner(t);
      }
      match /notes/{n} {
        allow create: if canView(t) && request.resource.data.fromUid == me();
        allow read: if canEdit(t) || (signedIn() && resource.data.fromUid == me());
        allow update, delete: if canEdit(t);
      }
      // ảnh: một tài liệu mô tả và dữ liệu ảnh (mảnh dưới 1 MB). Ai xem được cây thì xem được;
      // người sửa được cây thì thêm, xóa được; thành viên thêm, thay, xóa ảnh do chính mình tải lên
      match /photos/{f} {
        allow read: if canView(t);
        allow create: if canEdit(t) || (canAdd(t) && request.resource.data.get('by', '') == me());
        allow update: if canEdit(t) || (canAdd(t) && myDoc());
        allow delete: if canEdit(t) || (canAdd(t) && resource.data.get('by', '') == me());
        match /c/{i} {
          allow read: if canView(t);
          allow write: if canEdit(t) || (canAdd(t) && get(/databases/$(database)/documents/trees/$(t)/photos/$(f)).data.get('by', '') == me());
        }
      }
    }
    // thêm thành viên bằng email: mã = email + '__' + mã cây. Chỉ chủ cây tạo, sửa, xóa;
    // người được mời chỉ đọc được thư mời đúng email của mình
    match /invites/{id} {
      allow read: if (hasEmail() && resource.data.email == myEmail()) || (signedIn() && resource.data.by == me());
      allow create, update: if signedIn() && request.resource.data.by == me()
                  && tree(request.resource.data.tree).ownerUid == me()
                  && request.resource.data.email == request.resource.data.email.lower()
                  && id == request.resource.data.email + '__' + request.resource.data.tree
                  && request.resource.data.role in ['viewer', 'editor'];
      allow delete: if signedIn() && resource.data.by == me();
    }
  }
}`;

  /* ----- ghi ----- */
  toDoc: function (p) { const o = {}; Object.keys(p).forEach(function (k) { if (k !== 'id' && p[k] !== undefined) o[k] = p[k]; }); return o; },
  write: function (id, put, del) {
    if (!this.live(id)) return Promise.reject(new Error('chưa kết nối'));
    const F = this.fb.F, db = this.fb.db, self = this, jobs = [];
    let b = F.writeBatch(db), n = 0, bytes = 0;
    const flush = function () { if (n) { jobs.push(b.commit()); b = F.writeBatch(db); n = 0; bytes = 0; } };
    for (const p of put) {
      const size = (p.photo || '').length + 1500;
      if (n >= 200 || bytes + size > 3000000) flush();
      b.set(F.doc(db, 'trees', id, 'people', p.id), this.toDoc(p)); n++; bytes += size;
    }
    for (const x of del) { if (n >= 200) flush(); b.delete(F.doc(db, 'trees', id, 'people', x)); n++; }
    flush();
    if (this.cur && this.cur.role === 'admin') {
      clearTimeout(this.statTimer);
      this.statTimer = setTimeout(function () { F.updateDoc(F.doc(db, 'trees', id), { n: S.people.size, u: Date.now() }).catch(function () { }); }, 1500);
    }
    /* Khi mất mạng, Firestore giữ lệnh ghi trong máy và tự gửi lại khi có mạng, nên không chờ máy chủ trả lời */
    Promise.all(jobs).catch(function (e) { toast('Máy chủ từ chối lưu: ' + self.errText(e), true); });
    return Promise.resolve();
  },
  /* Thành viên: tách phần được phép ghi, đúng như bộ quy tắc cho phép. Người mới và người của mình thì ghi cả hồ sơ
     (kèm người thêm); người của người khác thì chỉ ghi phần nối: thêm / gỡ vợ chồng (arrayUnion / arrayRemove, giữ nguyên
     thứ tự), ô bố / mẹ. Xóa: chỉ người của mình. Gọi trước khi đổi S.people. */
  memberOps: function (put, del) {
    const uid = this.user ? this.user.uid : '', self = this, ops = [];
    put.forEach(function (p) {
      const o = S.people.get(p.id);
      if (!o || o.by === uid) { ops.push({ kind: 'set', id: p.id, doc: self.toDoc(Object.assign({}, p, { by: uid })) }); return; }
      const a = o.spouseIds || [], b = p.spouseIds || [];
      const op = { kind: 'link', id: p.id, u: p.u || Date.now(), add: b.filter(function (x) { return a.indexOf(x) < 0; }), rem: a.filter(function (x) { return b.indexOf(x) < 0; }) };
      if ((p.fatherId || '') !== (o.fatherId || '')) op.fa = p.fatherId || '';
      if ((p.motherId || '') !== (o.motherId || '')) op.mo = p.motherId || '';
      if (op.add.length || op.rem.length || 'fa' in op || 'mo' in op) ops.push(op);
    });

    return ops;
  },
  writeMember: function (id, ops) {
    if (!this.live(id)) return Promise.reject(new Error('chưa kết nối'));
    const F = this.fb.F, db = this.fb.db, self = this, b = F.writeBatch(db);
    ops.forEach(function (op) {
      const ref = F.doc(db, 'trees', id, 'people', op.id);
      if (op.kind === 'set') { b.set(ref, op.doc); return; }
      if (op.kind === 'del') { b.delete(ref); return; }
      const patch = { u: op.u };
      if (op.add.length) patch.spouseIds = F.arrayUnion.apply(null, op.add);
      else if (op.rem.length) patch.spouseIds = F.arrayRemove.apply(null, op.rem);
      if ('fa' in op) patch.fatherId = op.fa;
      if ('mo' in op) patch.motherId = op.mo;
      b.update(ref, patch);

    b.commit().catch(function (e) {
      toast(e && e.code === 'permission-denied' ? 'Máy chủ chưa cho lưu. Nếu bạn vừa thêm hay sửa người của mình, quản trị viên cần dán lại bộ quy tắc mới trong hướng dẫn (bước 14).' : 'Máy chủ từ chối lưu: ' + self.errText(e), true);
    });
    return Promise.resolve();
  },
  patchTree: function (id, patch) {
    if (this.state !== 'ready' || !this.user) return;
    const self = this;
    this.fb.F.updateDoc(this.fb.F.doc(this.fb.db, 'trees', id), patch).catch(function (e) { toast('Chưa cập nhật được lên mạng: ' + self.errText(e), true); });
  },
  publish: function () {
    const t = S.tree, self = this;
    if (!t || t.cloud) return;
    if (this.state !== 'ready' || !this.user) { toast('Hãy đăng nhập bằng Google trước.', true); return; }
    confirmBox({ title: 'Đưa cây lên mạng?', text: 'Cây “' + t.name + '” (' + S.people.size + ' người) sẽ được lưu vào kho Firebase của bạn để dùng trên nhiều máy và mời người trong họ cùng xem.', more: 'Bạn là quản trị viên. Người khác vào được sau khi bạn duyệt: xem cây, thêm người mới, sửa người do chính họ thêm và góp ý; muốn ai cùng sửa cả cây thì bạn cho cùng quản trị.', ok: 'Đưa lên mạng' }).then(function (yes) {
      if (!yes) return;
      const F = self.fb.F, db = self.fb.db, now = Date.now();
      toast('Đang đưa lên mạng…');
      F.setDoc(F.doc(db, 'trees', t.id), { name: t.name, note: t.note || '', rootId: t.rootId || '', ownerUid: self.user.uid, ownerName: self.user.name, open: false, n: S.people.size, c: t.c || now, u: now }).then(function () {
        t.cloud = true; t.role = 'admin'; t.ownerUid = self.user.uid; saveMeta();
        self.cur = { id: t.id, t: t, live: true, role: 'admin', pending: '', tree: null, me: undefined, notes: [], members: [], mine: [], subs: {}, asked: false };
        return self.write(t.id, Array.from(S.people.values()), []);
      }).then(function () { self.attach(t); refresh(); toast('Đã đưa lên mạng. Giờ bạn có thể gửi link mời.'); })
        .catch(function (e) { if (!t.ownerUid) { t.cloud = false; saveMeta(); } self.attach(t); refresh(); toast('Chưa đưa lên được: ' + self.errText(e), true); });
    });
  },
  deleteTree: function (id) {
    if (this.state !== 'ready' || !this.user) return Promise.reject(new Error('cần đăng nhập và có mạng'));
    const F = this.fb.F, db = this.fb.db;
    if (this.cur && this.cur.id === id) this.detach();
    const wipe = function (sub) {
      return F.getDocs(F.collection(db, 'trees', id, sub)).then(function (snap) {
        const refs = []; snap.forEach(function (d) { refs.push(d.ref); });
        const jobs = [];
        for (let i = 0; i < refs.length; i += 300) { const b = F.writeBatch(db); refs.slice(i, i + 300).forEach(function (r) { b.delete(r); }); jobs.push(b.commit()); }
        return Promise.all(jobs);
      });
    };
    /* ảnh: chỉ đọc các tài liệu mô tả (nhỏ), các mảnh thì xóa thẳng theo số mảnh, không tải về */
    const wipePhotos = function () {
      return F.getDocs(F.collection(db, 'trees', id, 'photos')).then(function (snap) {
        const refs = [];
        snap.forEach(function (d) { const n = (d.data() || {}).n || 1; for (let i = 0; i < n; i++) refs.push(F.doc(db, 'trees', id, 'photos', d.id, 'c', String(i))); refs.push(d.ref); });
        const jobs = [];
        for (let i = 0; i < refs.length; i += 300) { const b = F.writeBatch(db); refs.slice(i, i + 300).forEach(function (r) { b.delete(r); }); jobs.push(b.commit()); }
        return Promise.all(jobs);
      }).catch(function () { /* kho còn quy tắc cũ (chưa có mục ảnh) thì cũng chưa có ảnh nào */ });
    };
    return wipePhotos().then(function () { return wipe('people'); }).then(function () { return wipe('notes'); }).then(function () { return wipe('members'); }).then(function () { return F.deleteDoc(F.doc(db, 'trees', id)); });
  },
  leaveTree: function (id) {
    if (this.cur && this.cur.id === id) this.detach();
    if (this.state !== 'ready' || !this.user) return Promise.resolve();
    const F = this.fb.F;
    return F.updateDoc(F.doc(this.fb.db, 'users', this.user.uid), { ['joined.' + id]: F.deleteField() }).catch(function () { });
  },

  /* ----- đăng nhập ----- */
  signIn: function () {
    const self = this;
    if (A) return this.signInApp();
    if (!onWeb()) { toast('Đăng nhập Google chỉ chạy trên trang web (https). Hãy mở bản đã đưa lên GitHub Pages.', true); return Promise.resolve(); }
    if (inAppBrowser()) { this.openInBrowserHelp(); return Promise.resolve(); }
    if (this.state !== 'ready') { toast('Đang kết nối, bấm lại sau vài giây.', true); this.init(); return Promise.resolve(); }
    const U = this.fb.U, prov = new U.GoogleAuthProvider();

      dlg: true, title: 'Trình duyệt chặn cửa sổ đăng nhập',

  signInApp: function () {

  askWebUrl: function () {
    return promptBox({ title: 'Địa chỉ trang web của dòng họ', label: 'Địa chỉ web (GitHub Pages)', value: S.meta.webUrl || '', ph: 'https://ten.github.io/giapha/GiaPha.html', ok: 'Lưu', max: 300, help: 'Là nơi bạn đã tải tệp GiaPha.html lên. Ứng dụng mở trang này để đăng nhập Google và để tạo link mời.' }).then(function (v) {
      if (!v) return false;
      if (!/^https:\/\/[^\s]+$/i.test(v)) { toast('Địa chỉ phải bắt đầu bằng https://', true); return false; }
      S.meta.webUrl = v.split('#')[0]; saveMeta(); return true;
    });

  onAppAuth: function (d) {                      // APK nhận kết quả đăng nhập từ trình duyệt
    const self = this;
    let o; try { o = JSON.parse(unb64url(d)); } catch (e) { o = null; }
    if (!o || !o.idToken) { toast('Thông tin đăng nhập gửi về không hợp lệ.', true); return; }
    if (!this.cfg() && okCfg(o.cfg)) { S.meta.cfg = o.cfg; saveMeta(); }
    this.init().then(function (ok) {
      if (!ok) { toast('Chưa kết nối được tới Firebase.', true); return; }
      const U = self.fb.U;
      return U.signInWithCredential(self.fb.auth, U.GoogleAuthProvider.credential(o.idToken, o.accessToken || null)).then(function (r) { toast('Xin chào ' + (r.user.displayName || r.user.email || '')); });
    }).catch(function (e) { toast('Chưa đăng nhập được: ' + self.errText(e), true); });
  },
  appLoginPage: function () {                    // trang web được APK mở ra để đăng nhập hộ
    const self = this;

      dlg: true, sticky: true, title: 'Đăng nhập cho ứng dụng Gia Phả',
      body: html`<p id="alMsg">Đăng nhập bằng tài khoản Google của bạn. Xong, trang này sẽ đưa bạn quay lại ứng dụng trên điện thoại.</p><div id="alBox" style="margin-top:14px"><button class="btn pri block" data-act="go">Đăng nhập bằng Google</button></div>`,
      on: {
        go: function () {
          if (self.state !== 'ready') { toast(self.cfg() ? 'Đang kết nối, bấm lại sau vài giây.' : 'Trang web chưa gắn cấu hình Firebase. Hãy dán cấu hình vào tệp GiaPha.html (xem Hướng dẫn cài đặt, bước 18) rồi tải lại lên GitHub.', true); return; }
          const U = self.fb.U, prov = new U.GoogleAuthProvider();
          prov.setCustomParameters({ prompt: 'select_account' });
          U.signInWithPopup(self.fb.auth, prov).then(function (r) {
            const cred = U.GoogleAuthProvider.credentialFromResult(r);
            if (!cred || !cred.idToken) throw new Error('Google không trả mã đăng nhập');
            const d = b64url(JSON.stringify({ idToken: cred.idToken, accessToken: cred.accessToken || '', cfg: self.cfg() }));
            const intent = 'intent://auth?d=' + d + '#Intent;scheme=giapha;package=' + APP_PKG + ';end';
            $('#alMsg', sh.el).textContent = 'Đã đăng nhập: ' + (r.user.displayName || r.user.email || '') + '. Bấm nút dưới để quay lại ứng dụng.';
            setHTML($('#alBox', sh.el), html`<a class="btn pri block" href="${intent}">Quay lại ứng dụng</a><p class="muted sm center" style="margin-top:10px">Nếu nút trên không mở được ứng dụng, <a href="giapha://auth?d=${d}">bấm vào đây</a>.</p>`);
            try { location.href = intent; } catch (e) { /* người dùng bấm nút */ }
          }).catch(function (e) { toast('Chưa đăng nhập được: ' + self.errText(e), true); });
        }
      }
    });

  /* ----- vào cây qua link mời ----- */

      if (!snap.exists()) { self.dropInvite(id); toast('Link mời không còn dùng được (cây đã bị xóa).', true); return; }
      const d = snap.data(), mine = d.ownerUid === self.user.uid;
      self.upsertTree(id, { name: d.name, role: mine ? 'admin' : 'viewer', ownerName: d.ownerName, open: !!d.open, n: d.n });
      Sheets.closeAll();
      self.dropInvite(id);
      return switchTree(id).then(function () { setView('tree'); });
    }).catch(function (e) { toast('Chưa mở được cây: ' + self.errText(e), true); })
      .then(function () { self.joining = ''; self.autoOpen(); });

          <div class="sec">Không vào được bằng link?</div>
          <button class="btn block" data-act="byEmail">${icon('user')}Thêm thành viên bằng email</button>
          <div class="hint">${icon('info')}<span>Người nhận vào làm thành viên: xem cây, thêm người mới, tự sửa người do mình thêm và gửi góp ý; không sửa được người khác thêm. Muốn cho ai cùng sửa cả cây, vào Thành viên chọn Cho cùng quản trị. Bấm link ngay trong Zalo sẽ mở trình duyệt riêng của Zalo, nơi Google không cho đăng nhập; trang sẽ chỉ họ mở sang Chrome hoặc Safari mà vẫn giữ nguyên lời mời.</span></div>`,
        on: {
          share: function () { shareText('Gia phả ' + t.name, text); },
          copy: function () { copyText(link); },
          qrBig: function () { Sheets.open({ dlg: true, title: t.name, body: html`<img src="${qr}" alt="Mã QR mời" style="width:100%;display:block;image-rendering:pixelated">` }); },
          qrSave: function () {
            if (!cv) return;
            cv.toBlob(function (b) {
              if (!b) { toast('Chưa tạo được ảnh.', true); return; }
              const r = new FileReader();
              r.onload = function () { saveFile('MaQR_moi_' + fileSlug(t.name) + '.png', 'image/png', new Uint8Array(r.result)); };
              r.readAsArrayBuffer(b);
            }, 'image/png');
          },
          byEmail: function () { self.openInbox('mem'); }
        }
      });
    };
    if (!webBase()) this.askWebUrl().then(function (ok) { if (ok) make(); }); else make();
  },
  addInvite: function (email, role) {
    const cur = this.cur, t = S.tree, self = this;
    email = String(email || '').trim().toLowerCase();
    if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)) return Promise.reject(new Error('Email chưa đúng, ví dụ ten@gmail.com'));
    if (!cur || cur.role !== 'admin' || !t) return Promise.reject(new Error('Chỉ quản trị viên mới thêm được thành viên.'));
    if (this.user && email === (this.user.email || '').toLowerCase()) return Promise.reject(new Error('Đây là email của chính bạn, bạn đã là quản trị viên cây này.'));
    role = role === 'editor' ? 'editor' : 'viewer';
    const F = this.fb.F, db = this.fb.db;
    return F.setDoc(F.doc(db, 'invites', email + '__' + t.id), { email: email, tree: t.id, treeName: t.name, role: role, by: this.user.uid, byName: this.user.name, at: Date.now() })
      .then(function () {
        if (self.sentErr) self.watchSent();       // vừa dán bộ quy tắc mới: theo dõi lại danh sách email
        cur.members.forEach(function (m) {        // người này đã xin vào bằng link mà chưa được duyệt: duyệt luôn
          if ((m.email || '').toLowerCase() === email && (m.status !== 'approved' || m.role !== role)) self.setMember(m.uid, { status: 'approved', role: role });
        });
        return email;
      }, function (e) {
        throw new Error(e && e.code === 'permission-denied' ? 'Firebase đang dùng bộ quy tắc cũ, chưa có phần thêm bằng email. Hãy dán lại bộ quy tắc mới (Thêm → Hướng dẫn cài đặt, bước 14).' : 'Chưa thêm được: ' + self.errText(e));
      });
  },
  removeInvite: function (email) {
    const t = S.tree, F = this.fb.F, db = this.fb.db, self = this;
    return F.deleteDoc(F.doc(db, 'invites', email + '__' + t.id)).catch(function (e) { throw new Error('Chưa bỏ được: ' + self.errText(e)); });
  },

  /* ----- góp ý, kê khai ----- */
  sendNote: function (note) {
    const cur = this.cur, self = this;
    if (!cur || !cur.live) return Promise.reject(new Error('chưa kết nối tới cây'));
    const F = this.fb.F;
    const doc = Object.assign({ type: 'msg', personId: '', personName: '', text: '', data: null }, note, { fromUid: this.user.uid, fromName: this.user.name, fromEmail: this.user.email, at: Date.now(), status: 'new' });
    F.setDoc(F.doc(this.fb.db, 'trees', cur.id, 'notes', 'n' + GP.uid(15)), doc).catch(function (e) { toast('Chưa gửi được: ' + self.errText(e), true); });
    return Promise.resolve();
  },
  reportError: function (p) {
    const self = this;
    promptBox({ title: 'Báo sai sót', label: 'Thông tin nào của ' + p.name + ' chưa đúng?', area: true, ph: 'vd Năm sinh đúng là 1952, không phải 1950', ok: 'Gửi cho quản trị viên', max: 1500 }).then(function (text) {
      if (!text) return;
      self.sendNote({ type: 'error', personId: p.id, personName: p.name, text: text }).then(function () { toast('Đã gửi cho quản trị viên'); }, function (e) { toast('Chưa gửi được: ' + e.message, true); });
    });
  },
  declare: function () {
    const self = this;
    if (!this.live(S.tree.id)) { toast('Chưa kết nối tới cây này.', true); return; }
    openForm({
      declare: true, title: 'Kê khai thông tin', preset: { name: this.user.name },
      onSubmit: function (d) { delete d.id; delete d.c; delete d.u; return self.sendNote({ type: 'declare', personName: d.name, data: d }).then(function () { toast('Đã gửi tờ khai cho quản trị viên'); }); }
    });
  },
  message: function () {
    const self = this;
    promptBox({ title: 'Nhắn quản trị viên', label: 'Nội dung', area: true, ok: 'Gửi', max: 1500 }).then(function (text) {
      if (text) self.sendNote({ type: 'msg', text: text }).then(function () { toast('Đã gửi'); }, function (e) { toast('Chưa gửi được: ' + e.message, true); });
    });
  },
  setNote: function (id, patch) { const F = this.fb.F, self = this; F.updateDoc(F.doc(this.fb.db, 'trees', this.cur.id, 'notes', id), patch).catch(function (e) { toast(self.errText(e), true); }); },
  delNote: function (id) { const F = this.fb.F, self = this; F.deleteDoc(F.doc(this.fb.db, 'trees', this.cur.id, 'notes', id)).catch(function (e) { toast(self.errText(e), true); }); },
  setMember: function (uid, patch) { const F = this.fb.F, self = this; F.updateDoc(F.doc(this.fb.db, 'trees', this.cur.id, 'members', uid), patch).catch(function (e) { toast(self.errText(e), true); }); },

  openInbox: function (tab) {
    const self = this, cur = this.cur, t = S.tree;
    if (!t || !t.cloud) return;
    if (!cur || !cur.live) { toast(this.pendingText(t.id), true); return; }
    const admin = cur.role === 'admin', staff = admin || cur.role === 'editor';
    let view = tab || 'notes';
    const sh = Sheets.open({
      title: staff ? 'Góp ý và thành viên' : 'Góp ý của tôi', full: true,
      body: html`<div id="ibx"></div>`,
      on: {
        tab: function (b) { view = b.dataset.v; draw(); },
        done: function (b) { self.setNote(b.dataset.id, { status: 'done' }); },
        undo: function (b) { self.setNote(b.dataset.id, { status: 'new' }); },
        del: function (b) { confirmBox({ title: 'Xóa góp ý này?', text: 'Góp ý sẽ bị xóa hẳn.', ok: 'Xóa', danger: true }).then(function (y) { if (y) self.delNote(b.dataset.id); }); },
        person: function (b) { if (S.idx.get(b.dataset.id)) openDetail(b.dataset.id); else toast('Người này không còn trong cây.', true); },
        add: function (b) {
          const n = cur.notes.find(function (x) { return x.id === b.dataset.id; }); if (!n || !n.data) return;
          const d = cleanPerson(Object.assign({}, n.data, { id: 'p' + GP.uid(11) })) || {};
          const pre = { name: d.name, gender: d.gender, birth: d.birth, dead: d.dead, death: d.death, hometown: d.hometown, address: d.address, phone: d.phone, photo: d.photo, note: d.note, order: d.order };
          openForm({ preset: pre, fromNote: n, title: 'Thêm từ tờ khai', fill: { father: n.data.fatherName, mother: n.data.motherName, spouse: n.data.spouseName }, fillLabel: 'Người khai ghi', onSaved: function () { self.setNote(n.id, { status: 'done' }); } });
        },
        ok: function (b) { self.setMember(b.dataset.id, { status: 'approved' }); },
        block: function (b) { self.setMember(b.dataset.id, { status: 'blocked', role: 'viewer' }); },
        role: function (b) {
          const m = cur.members.find(function (x) { return x.uid === b.dataset.id; }), nm = (m && m.name) || 'Người này';
          self.setMember(b.dataset.id, { role: b.dataset.r });
          toast(b.dataset.r === 'editor' ? nm + ' được cùng quản trị, sửa được cây' : 'Đã thôi quyền cùng quản trị của ' + nm + '. Vẫn xem, thêm người và góp ý được');
        },
        open: function () { self.patchTree(t.id, { open: !t.open }); t.open = !t.open; draw(); },
        declare: function () { self.declare(); }, msg: function () { self.message(); }, share: function () { self.shareLink(); },
        invAdd: function (b) {
          const inp = $('#invE', sh.el), r = $('#invR', sh.el).value;
          b.disabled = true;
          self.addInvite(inp.value, r).then(function (em) {
            const el = $('#invE', sh.el); if (el) el.value = '';
            toast('Đã thêm ' + em + '. Người này đăng nhập Google bằng đúng email đó là thấy cây.');
            draw();
          }, function (err) { b.disabled = false; toast(err.message, true); });
        },
        rules: function () { copyText(RULES); self.openGuide(); },
        invDel: function (b) {
          const e = b.dataset.e;
          confirmBox({ title: 'Bỏ email ' + e + '?', text: 'Email này sẽ không tự vào được cây nữa.', more: 'Nếu người này đã vào cây thì vẫn xem được; muốn chặn hẳn, bấm Chặn ở danh sách thành viên.', ok: 'Bỏ email' }).then(function (y) {
            if (y) self.removeInvite(e).then(function () { draw(); }, function (err) { toast(err.message, true); });
          });
        }
      },
      onClose: function () { self.inboxDraw = null; }
    });
    const noteHTML = function (n, mine) {
      const d = n.data || {};
      const body = n.type === 'declare'
        ? html`<p><b>${d.name || ''}</b>${[d.gender === 'M' ? 'Nam' : d.gender === 'F' ? 'Nữ' : '', GP.fmtDate(d.birth)].filter(Boolean).map(function (x) { return ', ' + x; })}</p>
            <p class="muted sm">${[d.hometown ? 'Quê: ' + d.hometown : '', d.address ? 'Ở: ' + d.address : '', d.phone ? 'ĐT: ' + d.phone : '', d.fatherName ? 'Con ông ' + d.fatherName : '', d.motherName ? 'Con bà ' + d.motherName : '', d.spouseName ? 'Vợ/chồng: ' + d.spouseName : '', d.note || ''].filter(Boolean).join('. ')}</p>`
        : html`${n.personName ? html`<p class="muted sm">Về: <a href="#" data-act="person" data-id="${n.personId}">${n.personName}</a></p>` : ''}<p style="white-space:pre-wrap">${n.text}</p>`;
      return html`<div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="chip${n.status === 'done' ? ' q' : ''}">${n.type === 'declare' ? 'Tờ kê khai' : n.type === 'error' ? 'Báo sai sót' : 'Lời nhắn'}</span><span class="muted sm" style="margin-left:auto">${n.status === 'done' ? 'đã xử lý' : 'mới'}</span></div>${body}
        <p class="muted sm" style="margin-top:6px">${mine ? '' : (n.fromName || '') + (n.fromEmail ? ' (' + n.fromEmail + '), ' : ', ')}${fmtWhen(n.at)}</p>
        ${mine ? '' : html`<div class="btns" style="margin-top:10px">${n.type === 'declare' && n.status !== 'done' ? html`<button class="btn sm sec" data-act="add" data-id="${n.id}">${icon('plus')}Thêm vào cây</button>` : ''}${n.status === 'done' ? html`<button class="btn sm" data-act="undo" data-id="${n.id}">Đánh dấu chưa xong</button>` : html`<button class="btn sm" data-act="done" data-id="${n.id}">${icon('check')}Đã xử lý</button>`}<button class="btn sm danger" data-act="del" data-id="${n.id}">Xóa</button></div>`}</div>`;
    };
    const draw = function () {
      if (self.cur !== cur) return;
      const box = $('#ibx', sh.el); if (!box) return;
      if (!staff) {
        setHTML(box, html`<div class="btns" style="margin-bottom:14px"><button class="btn pri" data-act="declare">${icon('edit')}Kê khai thông tin</button><button class="btn" data-act="msg">${icon('note')}Nhắn quản trị viên</button></div>
          <p class="muted sm" style="margin-bottom:12px">Thấy thông tin của ai chưa đúng, bấm vào người đó trên cây rồi chọn “Báo sai sót”.</p>
          ${cur.mine.length ? cur.mine.map(function (n) { return noteHTML(n, true); }) : html`<p class="muted center" style="padding:20px 0">Bạn chưa gửi góp ý nào.</p>`}`);
        return;
      }
      const pend = cur.members.filter(function (m) { return m.status === 'pending'; }), done = cur.members.filter(function (m) { return m.status !== 'pending'; }), fresh = cur.notes.filter(function (n) { return n.status === 'new'; });
      const invCard = function () {
        const inv = (self.sent || []).filter(function (x) { return x.tree === t.id; });
        const inside = new Set(cur.members.filter(function (m) { return m.status === 'approved'; }).map(function (m) { return (m.email || '').toLowerCase(); }));
        return html`<div class="card" style="margin-bottom:12px"><b>Thêm thành viên bằng email</b>
          <p class="muted sm" style="margin:4px 0 10px">Dùng khi người nhận không vào được bằng link. Họ chỉ cần mở trang gia phả hoặc ứng dụng, đăng nhập Google bằng đúng email này là tự thấy cây “${t.name}”, không cần link, không phải chờ duyệt.</p>
          ${self.sentErr ? html`<div class="hint" style="margin:0 0 10px">${icon('warn')}<span>Kho Firebase còn bộ quy tắc cũ nên chưa thêm bằng email được. Bấm nút dưới để chép bộ quy tắc mới, dán đè vào Firebase như bước 14 của hướng dẫn, rồi quay lại đây bấm Thêm email.<br><button class="btn sm sec" data-act="rules" style="margin-top:8px">${icon('copy')}Chép bộ quy tắc mới</button></span></div>` : ''}
          <div class="invf"><input class="in" id="invE" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ten@gmail.com" aria-label="Email người được mời"><select class="in" id="invR" aria-label="Quyền"><option value="viewer">Thành viên</option><option value="editor">Cùng quản trị</option></select></div>
          <button class="btn sec block" data-act="invAdd" style="margin-top:12px">${icon('plus')}Thêm email</button>
          ${inv.length ? html`<div style="margin-top:12px">${inv.map(function (x) { return html`<div class="row flat"><span class="b"><span class="n" style="overflow-wrap:anywhere">${x.email}</span><span class="s">${x.role === 'editor' ? 'Cùng quản trị' : 'Thành viên'}. ${inside.has(x.email) ? 'Đã vào cây' : 'Chưa đăng nhập'}</span></span><span class="end"><button class="ib" data-act="invDel" data-e="${x.email}" aria-label="Bỏ email ${x.email}">${icon('x')}</button></span></div>`; })}</div>` : ''}</div>`;
      };
      const memRow = function (m) {
        return html`<div class="card"><div style="display:flex;gap:10px;align-items:center">${icon('user')}<div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${m.name || 'Thành viên'}</b><div class="muted sm" style="overflow-wrap:anywhere">${m.email || ''}</div></div><span class="chip${m.status === 'approved' ? '' : ' q'}">${m.status === 'approved' ? (m.role === 'editor' ? 'cùng quản trị' : 'thành viên') : m.status === 'blocked' ? 'đã chặn' : 'chờ duyệt'}</span></div>
          <div class="btns" style="margin-top:10px">${m.status !== 'approved' ? html`<button class="btn sm sec" data-act="ok" data-id="${m.uid}">${icon('check')}${m.status === 'blocked' ? 'Cho xem lại' : 'Duyệt'}</button>` : html`<button class="btn sm" data-act="role" data-r="${m.role === 'editor' ? 'viewer' : 'editor'}" data-id="${m.uid}">${m.role === 'editor' ? 'Thôi cùng quản trị' : 'Cho cùng quản trị'}</button>`}${m.status !== 'blocked' ? html`<button class="btn sm danger" data-act="block" data-id="${m.uid}">${m.status === 'pending' ? 'Từ chối' : 'Chặn'}</button>` : ''}</div></div>`;
      };
      const keep = {}, focus = document.activeElement && document.activeElement.id;
      ['invE', 'invR'].forEach(function (k) { const el = $('#' + k, sh.el); if (el) keep[k] = el.value; });
      setHTML(box, html`<div class="seg" style="margin-bottom:14px"><label><input type="radio" name="ibt" ${view === 'notes' ? raw('checked') : ''} data-act="tab" data-v="notes"><span>Góp ý${fresh.length ? ' (' + fresh.length + ')' : ''}</span></label>${admin ? html`<label><input type="radio" name="ibt" ${view === 'mem' ? raw('checked') : ''} data-act="tab" data-v="mem"><span>Thành viên${pend.length ? ' (' + pend.length + ')' : ''}</span></label>` : ''}</div>
        ${view === 'notes' ? (cur.notes.length ? cur.notes.map(function (n) { return noteHTML(n, false); }) : html`<p class="muted center" style="padding:24px 0">Chưa có góp ý hay tờ khai nào.</p>`)
          : html`${pend.length ? html`<div class="sec" style="margin-top:0">Đang chờ duyệt (${pend.length})</div>${pend.map(memRow)}<div style="height:18px"></div>` : ''}
            <div class="hint" style="margin:0 0 12px">${icon('info')}<span><b>Thành viên</b> xem cây, thêm được người mới, tự sửa và xóa những người do chính mình thêm (ví dụ báo mới mất, mới sinh). Người do người khác thêm thì thành viên chỉ gửi góp ý được. <b>Cùng quản trị</b> thì sửa, xóa được mọi người như bạn và đọc được góp ý. Bấm Thôi cùng quản trị là người đó trở lại làm thành viên.</span></div>
            ${invCard()}
            <label class="chk card" style="margin-bottom:12px"><input type="checkbox" data-act="open" ${t.open ? raw('checked') : ''}><span>Ai có link và đã đăng nhập đều xem được, không cần duyệt</span></label>
            <button class="btn block" data-act="share" style="margin-bottom:12px">${icon('share')}Gửi link, mã QR mời</button>
            ${done.length ? html`<div class="sec">Đã vào cây (${done.length})</div>${done.map(memRow)}` : pend.length ? '' : html`<p class="muted center" style="padding:20px 0">Chưa có ai xin tham gia. Hãy gửi link, mã QR mời, hoặc thêm email người trong họ.</p>`}`}`);
      Object.keys(keep).forEach(function (k) { const el = $('#' + k, sh.el); if (el) el.value = keep[k]; });
      if (focus === 'invE') { const el = $('#invE', sh.el); if (el) el.focus(); }
    };
    this.inboxDraw = draw;
    draw();
  },

  /* ----- mục "Dùng chung qua mạng" trong trang Thêm ----- */
  menu: function () {
    const t = S.tree, cur = this.cur, cfg = this.cfg();
    const item = function (act, ic, name, sub) { return html`<button data-m="${act}">${icon(ic)}<span class="b"><span class="n">${name}</span>${sub ? html`<span class="s">${sub}</span>` : ''}</span>${icon('go', 'go')}</button>`; };
    const rows = [];
    if (!cfg) {
      rows.push(item('c-setup', 'cloud', 'Bật dùng chung qua mạng', 'Cần một kho Firebase miễn phí của riêng dòng họ, có hướng dẫn từng bước'));
      if (A) rows.push(item('c-login', 'user', 'Đăng nhập qua trang web của dòng họ', 'Nếu quản trị viên đã đưa trang lên GitHub, chỉ cần nhập địa chỉ web'));
    } else if (this.state === 'loading' || this.state === 'off') rows.push(html`<button disabled><span class="spin"></span><span class="b"><span class="n">Đang kết nối…</span></span></button>`);
    else if (this.state === 'error') rows.push(item('c-retry', 'warn', 'Chưa kết nối được', 'Kiểm tra mạng rồi bấm để thử lại'));
    else if (!this.user) rows.push(item('c-login', 'user', 'Đăng nhập bằng Google', 'Để đưa cây lên mạng hoặc xem cây được mời'));
    else {
      rows.push(html`<button data-m="c-logout">${icon('user')}<span class="b"><span class="n">${this.user.name}</span><span class="s">${this.user.email}. Bấm để đăng xuất</span></span>${icon('out', 'go')}</button>`);
      if (t && !t.cloud) rows.push(item('c-publish', 'up', 'Đưa cây đang mở lên mạng', 'Để dùng trên nhiều máy và mời người trong họ cùng xem'));
      if (t && t.cloud && cur && cur.live) {

/* ---- ui-gio.js ---- */
/* ===== ui-gio.js — ngày giỗ: lịch giỗ sắp tới, chọn người được nhắc, gửi lịch nhắc cho ứng dụng Android ===== */
const Gio = {
  timer: 0, last: [],
  cfg: function () {
    let g = S.meta.gio;
    if (!g || typeof g !== 'object') g = S.meta.gio = {};
    if (typeof g.on !== 'boolean') g.on = false;
    if (!Array.isArray(g.before)) g.before = [3, 0];
    if (!(g.hour >= 0 && g.hour <= 23)) g.hour = 7;
    if (!g.sel || typeof g.sel !== 'object') g.sel = {};
    if (!g.me || typeof g.me !== 'object') g.me = {};
    return g;
  },
  selSet: function (treeId) { return new Set(this.cfg().sel[treeId] || []); },
  isOn: function (treeId, pid) { return this.cfg().on && this.selSet(treeId).has(pid); },
  setSel: function (treeId, set) { this.cfg().sel[treeId] = Array.from(set); saveMeta(); this.sync(); },
  setOne: function (treeId, pid, on) {
    const s = this.selSet(treeId);
    if (on) s.add(pid); else s.delete(pid);
    if (on && !this.cfg().on) this.enable();
    this.setSel(treeId, s);
    toast(on ? 'Sẽ nhắc trước ngày giỗ người này' : 'Đã bỏ nhắc ngày giỗ người này');
  },
  enable: function () {
    this.cfg().on = true; saveMeta();
    if (A && A.notifyStatus && A.notifyStatus() === 'need' && A.askNotify) { try { A.askNotify(); } catch (e) { /* bỏ qua */ } }
  },
  status: function () { try { return A && A.notifyStatus ? A.notifyStatus() : 'ok'; } catch (e) { return 'ok'; } },
  relTerm: function (idx, me, pid) {
    if (!me || me === pid || !idx.get(me)) return '';
    const r = idx.relation(me, pid);
    return r && r.ab && r.ab.term && r.ab.term.indexOf('/') < 0 ? r.ab.term : '';
  },
  /* Họ hàng gần: mọi bề trên trực hệ (bố mẹ, ông bà, cụ, kỵ), người trong vòng 3 bậc (anh chị em, bác chú cô cậu dì,
     cháu, chắt), anh chị em của các bề trên, cùng vợ/chồng của họ; bên vợ/chồng thì lấy bố mẹ, ông bà */
  isClose: function (idx, me, pid) {
    if (!me || !idx.get(me)) return false;
    if (me === pid) return true;
    const r = idx.relation(me, pid);
    if (!r) return false;
    const near = function (k) { return k.type === 'anc' || k.u + k.d <= 3 || (k.d === 1 && k.u <= 3); };
    if (r.kind === 'spouse') return true;
    if (r.kind === 'blood') return near(r.ab.k);
    if (r.kind === 'inlaw' && r.ab.k) {
      if (r.ab.k.type === 'sor') return near(r.ab.k.rk);
      if (r.ab.k.type === 'ros') return r.ab.k.rk.type === 'anc';
    }
    return false;
  },
  sync: function () {
    if (!A || !A.setReminders) return;
    clearTimeout(this.timer);
    const self = this;
    this.timer = setTimeout(function () { self.push(); }, 700);
  },
  /* Tính các lần nhắc trong 3 năm tới cho mọi cây, gửi cho Android tự hẹn giờ */
  push: function () {
    if (!A || !A.setReminders) return Promise.resolve();
    const g = this.cfg(), self = this;
    if (!g.on) { try { A.setReminders(JSON.stringify({ events: [] })); } catch (e) { /* bỏ qua */ } this.last = []; return Promise.resolve(); }
    const today = GP.todayIso(), now = Date.now();
    const jobs = S.meta.trees.map(function (t) {
      const sel = g.sel[t.id];
      if (!sel || !sel.length) return Promise.resolve([]);
      const here = S.tree && S.tree.id === t.id;
      return (here ? Promise.resolve(null) : DB.get('p:' + t.id)).then(function (arr) {
        const idx = here ? S.idx : new GP.Index((arr || []).map(cleanPerson).filter(Boolean));
        const ev = [];
        for (const pid of sel) {
          const p = idx.get(pid);
          if (!p) continue;
          const term = self.relTerm(idx, g.me[t.id], pid), who = (term ? term + ' ' : '') + p.name;
          for (const o of GP.gioList(p, today, 3 * 366)) {
            const d = GP.dateParts(o.iso), l = GP.lunarOf(o.iso);
            for (const b of g.before) {
              const at = new Date(d.y, d.m - 1, d.d - b, g.hour, 0, 0).getTime();
              if (at < now - 60000) continue;
              ev.push({
                key: t.id + '|' + pid + '|' + o.iso + '|' + b, at: at, tree: t.id, person: pid,
                title: b === 0 ? 'Hôm nay giỗ ' + who : b === 1 ? 'Ngày mai giỗ ' + who : 'Còn ' + b + ' ngày đến giỗ ' + who,
                text: 'Ngày ' + GP.fmtDate(o.iso) + ' (' + l.d + '/' + l.m + ' âm lịch)' + (o.n ? ', ' + GP.gioLabel(o.n) : '') + '. Cây: ' + t.name
              });
            }
          }
        }
        return ev;
      });
    });
    return Promise.all(jobs).then(function (lists) {
      const events = [].concat.apply([], lists).sort(function (a, b) { return a.at - b.at; }).slice(0, 600);
      self.last = events;
      try { A.setReminders(JSON.stringify({ events: events })); } catch (e) { /* bỏ qua */ }
    });
  },
  /* Lần giỗ gần nhất trong cây đang mở (để hiện ở trang Thêm) */
  soonest: function () {
    if (!S.tree) return null;
    let best = null;
    S.people.forEach(function (p) {
      const nx = p.dead && GP.nextGio(p);
      if (nx && (!best || nx.days < best.nx.days)) best = { p: p, nx: nx };
    });
    return best;
  }
};

function openGio() {
  if (!S.tree) { toast('Chưa có cây gia phả nào.', true); return; }
  const t = S.tree, g = Gio.cfg(), today = GP.todayIso();
  const sh = Sheets.open({
    title: 'Ngày giỗ', full: true, body: html`<div id="gioBox"></div>`,
    on: {
      onoff: function (b) {
        if (b.checked) {
          Gio.enable();
          if (!Gio.selSet(t.id).size) {        // lần đầu bật: chọn sẵn người gần, chưa biết "tôi là ai" thì chọn hết
            const me = g.me[t.id], pick = new Set();
            S.people.forEach(function (p) { if (GP.gioOf(p) && (!me || Gio.isClose(S.idx, me, p.id))) pick.add(p.id); });
            g.sel[t.id] = Array.from(pick);
            if (pick.size) toast('Đã chọn sẵn ' + pick.size + ' người. Bỏ bớt người họ xa nếu không cần nhắc.');
          }
        } else g.on = false;
        saveMeta(); Gio.sync(); draw();
      },
      before: function (b) {
        const v = +b.dataset.v, s = new Set(g.before);
        if (s.has(v)) s.delete(v); else s.add(v);
        if (!s.size) { toast('Cần chọn ít nhất một mốc báo.', true); return; }
        g.before = Array.from(s).sort(function (x, y) { return y - x; }); saveMeta(); Gio.sync(); draw();
      },
      ask: function () { try { A.askNotify(); } catch (e) { /* bỏ qua */ } },
      settings: function () { try { A.openNotifySettings(); } catch (e) { /* bỏ qua */ } },
      test: function () { try { A.testReminder(); toast('Đã gửi một thông báo thử. Nếu không thấy, hãy kiểm tra quyền thông báo.'); } catch (e) { toast('Bản ứng dụng này chưa hỗ trợ báo thử.', true); } },
      me: function () { pickPerson({ title: 'Bạn là ai trong cây này?' }).then(function (id) { if (id) { g.me[t.id] = id; saveMeta(); Gio.sync(); draw(); } }); },
      meX: function () { delete g.me[t.id]; saveMeta(); Gio.sync(); draw(); },
      close2: function () {
        const me = g.me[t.id];
        if (!me) { toast('Hãy chọn "Tôi là ai" trước để biết ai là họ hàng gần.', true); return; }
        const s = new Set();
        S.people.forEach(function (p) { if (GP.gioOf(p) && Gio.isClose(S.idx, me, p.id)) s.add(p.id); });
        Gio.setSel(t.id, s); draw(); toast('Đã chọn ' + s.size + ' người là họ hàng gần.');
      },
      all: function () { const s = new Set(); S.people.forEach(function (p) { if (GP.gioOf(p)) s.add(p.id); }); Gio.setSel(t.id, s); draw(); },
      none: function () { Gio.setSel(t.id, new Set()); draw(); },
      pick: function (b) { const s = Gio.selSet(t.id); if (b.checked) s.add(b.dataset.id); else s.delete(b.dataset.id); Gio.setSel(t.id, s); draw(); },
      open: function (b) { openDetail(b.dataset.id); },
      fix: function (b) { if (canEditPerson(S.people.get(b.dataset.id))) openForm({ id: b.dataset.id }); else openDetail(b.dataset.id); }
    },
    onClose: function () { Gio.redraw = null; }
  });
  const draw = function () {
    const box = $('#gioBox', sh.el);
    if (!box) return;
    const me = g.me[t.id], meP = me && S.idx.get(me), sel = Gio.selSet(t.id), st = A ? Gio.status() : 'web';
    const withDate = [], noDate = [];
    S.people.forEach(function (p) {
      if (!p.dead) return;
      const nx = GP.nextGio(p, today);
      if (nx) withDate.push({ p: p, nx: nx }); else noDate.push(p);
    });
    withDate.sort(function (a, b) { return a.nx.days - b.nx.days; });
    const chosen = withDate.filter(function (x) { return sel.has(x.p.id); }).length;
    const row = function (x) {
      const p = x.p, term = Gio.relTerm(S.idx, me, p.id), g0 = GP.gioOf(p), nx = x.nx;
      const right = html`<span class="end" style="flex-direction:column;align-items:flex-end;gap:2px"><b style="font-size:14px">${GP.fmtDate(nx.iso).slice(0, 5)}</b><span class="sm muted">${nx.days === 0 ? 'hôm nay' : nx.days === 1 ? 'ngày mai' : 'còn ' + nx.days + ' ngày'}</span></span>`;
      const sub = [term, 'giỗ ' + g0.d + '/' + g0.m + ' âm lịch', nx.n ? GP.gioLabel(nx.n) : ''].filter(Boolean).join(', ');
      if (A && g.on) return html`<label class="row flat" style="cursor:pointer"><input type="checkbox" data-act="pick" data-id="${p.id}" ${sel.has(p.id) ? raw('checked') : ''} style="width:22px;height:22px;accent-color:var(--son);flex:none">${av(p)}<span class="b"><span class="n">${p.name}</span><span class="s">${sub}</span></span>${right}</label>`;
      return html`<button class="row flat" data-act="open" data-id="${p.id}">${av(p)}<span class="b"><span class="n">${p.name}</span><span class="s">${sub}</span></span>${right}</button>`;
    };
    const perm = st === 'need' ? html`<p class="sm" style="margin-top:6px;color:var(--son)">Ứng dụng chưa được phép gửi thông báo. <button class="btn sm" data-act="ask">Cho phép</button></p>`
      : st === 'off' ? html`<p class="sm" style="margin-top:6px;color:var(--son)">Thông báo của ứng dụng đang bị tắt trong cài đặt máy. <button class="btn sm" data-act="settings">Mở cài đặt</button></p>` : '';
    const chip = function (v, label) { return html`<button class="tg2" data-act="before" data-v="${v}" aria-pressed="${g.before.indexOf(v) >= 0 ? 'true' : 'false'}">${label}</button>`; };
    setHTML(box, html`
      ${A ? html`<div class="card">
          <label class="chk" style="min-height:36px"><input type="checkbox" data-act="onoff" ${g.on ? raw('checked') : ''}><b>Nhắc ngày giỗ trên điện thoại này</b></label>
          ${g.on ? html`${perm}
            <div class="fld" style="margin:12px 0 10px"><span>Báo trước</span><div class="chips">${chip(7, 'Trước 7 ngày')}${chip(3, 'Trước 3 ngày')}${chip(1, 'Trước 1 ngày')}${chip(0, 'Đúng ngày')}</div></div>
            <label class="fld" style="margin-bottom:10px"><span>Giờ báo</span><select class="in" id="gHour" style="max-width:150px">${[5, 6, 7, 8, 9, 10, 12, 17, 19, 20, 21].map(function (h) { return html`<option value="${h}" ${h === g.hour ? raw('selected') : ''}>${h}:00</option>`; })}</select></label>
            <p class="muted sm">Đang nhắc ${chosen}/${withDate.length} người. Ngày giỗ tính theo âm lịch, tự đổi ra ngày dương từng năm.</p>
            <div class="btns" style="margin-top:10px"><button class="btn sm" data-act="test">${icon('flag')}Báo thử</button></div>` : html`<p class="muted sm">Bật lên để điện thoại tự báo trước ngày giỗ của những người bạn chọn, kể cả khi không mở ứng dụng.</p>`}
        </div>` : html`<div class="hint" style="margin-top:0">${icon('info')}<span>Thông báo nhắc ngày giỗ có trên ứng dụng Android. Ở đây bạn xem được lịch giỗ sắp tới của cây.</span></div>`}
      <div class="sec">Tôi là ai trong cây này</div>
      ${meP ? html`<div class="row flat">${av(meP)}<span class="b"><span class="n">${meP.name}</span><span class="s">Cách gọi bên dưới tính theo người này</span></span><span class="end"><button class="btn sm" data-act="me">Đổi</button><button class="ib" data-act="meX" aria-label="Bỏ chọn">${icon('x')}</button></span></div>`
        : html`<button class="btn block" data-act="me" style="border-style:dashed;justify-content:flex-start">${icon('user')}Chọn mình trong cây</button><p class="muted sm" style="margin-top:6px">Để thấy cách gọi (ông nội, bà ngoại…) và chọn nhanh họ hàng gần.</p>`}
      ${A && g.on ? html`<div class="btns" style="margin-top:14px"><button class="btn sm sec" data-act="close2">Chỉ họ hàng gần</button><button class="btn sm" data-act="all">Chọn tất cả</button><button class="btn sm" data-act="none">Bỏ chọn</button></div>
        <p class="muted sm" style="margin-top:6px">Họ hàng gần: bố mẹ, ông bà, cụ kỵ, anh chị em, bác chú cô cậu dì, ông chú bà cô, con cháu, cùng vợ chồng của họ, và bố mẹ, ông bà bên vợ/chồng.</p>` : ''}
      <div class="sec">Giỗ sắp tới<small>${withDate.length} người</small></div>
      ${withDate.length ? withDate.map(row) : html`<p class="muted">Chưa có ai trong cây có ngày giỗ. Nhập ngày mất (dương lịch) hoặc ngày giỗ âm lịch cho người đã mất.</p>`}
      ${noDate.length ? html`<div class="sec">Chưa có ngày giỗ<small>${noDate.length} người</small></div>
        ${noDate.map(function (p) { return html`<button class="row flat" data-act="fix" data-id="${p.id}">${av(p)}<span class="b"><span class="n">${p.name}</span><span class="s">${GP.fmtDate(p.death) ? 'Mất ' + GP.fmtDate(p.death) + ', cần đủ ngày tháng' : 'Chưa có ngày mất'}${canEditPerson(p) ? '. Bấm để thêm' : ''}</span></span></button>`; })}` : ''}`);
    const hs = $('#gHour', box);
    if (hs) hs.addEventListener('change', function () { g.hour = +hs.value; saveMeta(); Gio.sync(); });
  };
  Gio.redraw = draw;
  draw();
}

/* ---- ui-main.js ---- */
/* ===== ui-main.js — khởi động ===== */
function readHash() {                      // đọc tham số ở cả ?a=b (link mới) và #a=b (link cũ)
  const out = {}, src = location.search.replace(/^\?/, '') + '&' + location.hash.replace(/^#/, '');
  src.split('&').forEach(function (kv) {
    const i = kv.indexOf('=');
    if (i > 0) { try { out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* bỏ qua */ } }
  });
  return out;
}
function loadMeta(m) {
  if (!m || typeof m !== 'object') return;
  const t = Array.isArray(m.trees) ? m.trees.filter(function (x) { return x && typeof x.id === 'string' && x.id; }) : [];
  S.meta = {
    v: 1, trees: t, cur: typeof m.cur === 'string' ? m.cur : '',
    cfg: okCfg(m.cfg) ? m.cfg : null, webUrl: typeof m.webUrl === 'string' ? m.webUrl : '', joined: {},
    pendInv: m.pendInv && typeof m.pendInv.id === 'string' && /^[a-z0-9]{8,40}$/i.test(m.pendInv.id) ? { id: m.pendInv.id, name: String(m.pendInv.name || '').slice(0, 80), at: +m.pendInv.at || 0 } : null
  };
}
/* Nút quay lại của Android: đóng tấm đang mở, hoặc về màn hình cây. Trả false để ứng dụng tự thoát */
window.GP_back = function () {
  if (Sheets.stack.length) { Sheets.close(Sheets.stack[Sheets.stack.length - 1]); return true; }
  if (S.view !== 'tree') { setView('tree'); return true; }
  return false;
};
window.GP_onAppAuth = function (d) { Cloud.onAppAuth(d); };
window.GP_join = function (link) { Cloud.joinFromText(link); };

async function boot() {
  await DB.open();
  loadMeta(await DB.get('meta'));
  const h = readHash();
  bindShell(); bindMore();
  if (h.c) await Cloud.takeCfg(h.c);
  const cur = treeById(S.meta.cur) ? S.meta.cur : (S.meta.trees[0] ? S.meta.trees[0].id : '');
  await switchTree(cur);
  setView('tree');
  let jid = h.join && /^[a-z0-9]{8,40}$/i.test(h.join) ? h.join : '', jname = (h.n || '').slice(0, 80);
  const pi = S.meta.pendInv;
  /* Lời mời chưa xong lần trước (lỡ đóng rồi tải lại trang, hoặc ứng dụng bị tắt lúc sang trình duyệt đăng nhập): mời lại */
  if (!jid && pi && !h.applogin && Date.now() - pi.at < 30 * 864e5) { jid = pi.id; jname = pi.name; }
  if (jid) Cloud.lastInvite = { id: jid, name: jname };
  if (jid && !Cloud.cfg()) Cloud.pendingJoin = jid;   // ứng dụng chưa có cấu hình: đăng nhập qua trang web xong thì vào cây
  if (h.applogin) Cloud.appLoginMode = true;   // trang chỉ để đăng nhập hộ ứng dụng: không tự mở cây
  const iab = !!jid && inAppBrowser();
  try {
    /* Trong Zalo, Facebook…: giữ nguyên lời mời trên thanh địa chỉ, để nút “Mở bằng trình duyệt” của Zalo mang theo được.
       Trình duyệt thường: xóa cho gọn (lời mời đã được nhớ trong máy cho tới khi vào được cây). */
    if (iab) history.replaceState(null, '', Cloud.curInviteLink());
    else if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  } catch (e) { /* bỏ qua */ }
  if (Cloud.cfg()) {
    if (iab) Cloud.openInBrowserHelp();          // đang ở trình duyệt của Zalo…: chỉ cách mở sang Chrome/Safari, giữ nguyên lời mời
    Cloud.init().then(function (ok) {
      if (!ok) return;
      if (jid && !iab) Cloud.joinPage(jid, jname);
      if (h.applogin) Cloud.appLoginPage();
    });
  } else if (h.join || h.applogin) {
    infoBox('Thiếu cấu hình kết nối', html`<p>Link này không kèm cấu hình kết nối tới kho dữ liệu của dòng họ. Hãy nhờ quản trị viên gửi lại link mời mới.</p>`);
  }
  Gio.sync();
  setTimeout(function () { Photos.gcLocal().catch(function () { }); }, 8000);   // dọn ảnh không còn ai dùng trong máy
  if (A && A.ready) { try { A.ready(); } catch (e) { /* bỏ qua */ } }
}
boot().catch(function (e) {
  console.error(e);
  document.body.insertAdjacentHTML('beforeend', '<p style="padding:20px;color:#C2362B">Không khởi động được ứng dụng: ' + esc(e && e.message) + '</p>');
});

</script>
